# The container image, built on every push to main and published to this repository's own
# GitHub Container Registry: ghcr.io/<owner>/<repo>:main and :sha-<commit>. Nothing here
# deploys anywhere: whoever hosts it pulls the image (see examples/deploy/).
#
# The checks (types, lint, tests) run on the developer's machine before a push
# (lefthook.yml), not here.
name: image
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: image
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # Both Intel/AMD and ARM (Apple silicon, Raspberry Pi, Graviton) machines can run it.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Image names must be lower case; this takes care of it.
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=main
            type=sha,prefix=sha-,format=long
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
