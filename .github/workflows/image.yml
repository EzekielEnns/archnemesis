# The container image, built on every push to main that passes the checks (check.yml), and on
# every release tag (v0.4.0 also tags the image 0.4.0), and published to this repository's own
# GitHub Container Registry: ghcr.io/<owner>/<repo> (:latest and :main) and :sha-<commit>. Nothing here
# deploys anywhere: whoever hosts it pulls the image (see examples/deploy/).
name: image
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: image
  cancel-in-progress: true

jobs:
  check:
    uses: ./.github/workflows/check.yml
  image:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # Both Intel/AMD and ARM (Apple silicon, Raspberry Pi, Graviton) machines can run it.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Image names must be lower case; this takes care of it.
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=long
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
