<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>atlas · left panel v2 and diffs</title>
<style>
  :root {
    --bg: #0f1115; --side: #12151b; --panel: rgba(22, 25, 32, 0.97); --field: #1b1f27;
    --line: #262c36; --line-strong: #353d4a; --text: #e6e9ef; --muted: #8b93a3; --faint: #5d6576; --accent: #4f8cff;
    --add: #34d399; --mod: #fbbf24; --del: #f87171; --move: #60a5fa;
    --actor: #a78bfa; --system: #60a5fa; --app: #34d399; --store: #fbbf24; --component: #f472b6;
    --module: #fb923c; --function: #5eead4; --library: #c084fc; --table: #facc15; --group: #94a3b8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 Inter, ui-sans-serif, system-ui, -apple-system, sans-serif; }
  button { font: inherit; color: inherit; }
  svg.i { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .app { display: grid; grid-template-rows: 44px 1fr; height: 100vh; }

  .proto { display: flex; align-items: center; gap: 8px; padding: 0 14px; border-bottom: 1px solid var(--line); background: #0c0e12; }
  .proto b { font-weight: 600; margin-right: 6px; color: var(--muted); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
  .proto button, .proto select { border: 1px solid var(--line); background: var(--field); border-radius: 8px; padding: 5px 10px; cursor: pointer; color: var(--muted); font: inherit; }
  .proto button.on { color: var(--text); border-color: var(--accent); background: rgba(79,140,255,.12); }
  .proto .sp { flex: 1; }
  .proto label { color: var(--muted); font-size: 12px; display: flex; gap: 6px; align-items: center; }

  .page { display: none; min-height: 0; }
  .page.on { display: flex; }

  /* ---- Panel ---- */
  .panel { width: 260px; flex: none; display: flex; flex-direction: column; background: var(--side); border-right: 1px solid var(--line); min-height: 0; }
  .p-top { display: flex; align-items: center; gap: 4px; padding: 10px 8px 8px 10px; }
  .branch { display: flex; align-items: center; gap: 7px; padding: 5px 8px; border-radius: 8px; border: 0; background: none; cursor: pointer; min-width: 0; flex: 1; text-align: left; }
  .branch:hover, .branch.open { background: var(--field); }
  .branch .nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .branch .forks { font-size: 11px; color: var(--muted); background: #222834; border-radius: 6px; padding: 0 5px; }
  .branch .car { color: var(--faint); font-size: 10px; }
  .ib { width: 30px; height: 30px; display: grid; place-items: center; border: 0; background: none; border-radius: 8px; cursor: pointer; color: var(--muted); position: relative; flex: none; }
  .ib:hover { background: var(--field); color: var(--text); }
  .ib.on { background: #232a36; color: var(--text); }
  .ib .pip { position: absolute; right: 5px; top: 5px; width: 7px; height: 7px; border-radius: 4px; border: 1.5px solid var(--side); }
  .git-local { color: var(--muted); } .git-github { color: var(--add); } .git-syncing { color: var(--accent); } .git-error { color: var(--del); }
  .git-syncing svg { animation: spin 1.2s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .tools { display: flex; gap: 2px; padding: 0 8px 8px; border-bottom: 1px solid var(--line); }
  .tools .div { width: 1px; background: var(--line); margin: 6px 4px; }
  .p-body { flex: 1; overflow: auto; padding: 6px; min-height: 0; }
  .row { display: flex; align-items: center; gap: 6px; height: 27px; padding: 0 6px; border-radius: 7px; cursor: pointer; white-space: nowrap; position: relative; }
  .row:hover { background: #191d25; }
  .row.here { background: rgba(79,140,255,.14); }
  .chev { width: 12px; color: var(--faint); font-size: 9px; text-align: center; flex: none; }
  .dot { width: 8px; height: 8px; border-radius: 3px; flex: none; }
  .label { flex: 1; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
  .row:hover .label, .row.here .label { color: var(--text); }
  .mk { font-size: 10px; font-weight: 700; padding: 0 4px; border-radius: 4px; }
  .mk.add { color: var(--add); background: rgba(52,211,153,.14); } .mk.mod { color: var(--mod); background: rgba(251,191,36,.14); } .mk.del { color: var(--del); background: rgba(248,113,113,.14); } .mk.move { color: var(--move); background: rgba(96,165,250,.14); }
  .sect { margin: 12px 6px 4px; font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); font-weight: 600; }

  /* Branch popover */
  .pop { position: absolute; z-index: 40; width: 300px; background: var(--panel); border: 1px solid var(--line-strong); border-radius: 12px; box-shadow: 0 16px 40px rgba(0,0,0,.55); padding: 6px; display: none; }
  .pop.on { display: block; }
  .bitem { display: flex; align-items: center; gap: 9px; padding: 7px 8px; border-radius: 8px; cursor: pointer; }
  .bitem:hover { background: var(--field); }
  .bitem.on { background: rgba(79,140,255,.12); }
  .bitem .meta { flex: 1; min-width: 0; }
  .bitem .meta b { display: block; font-weight: 600; font-size: 13px; }
  .bitem .meta small { color: var(--muted); font-size: 11.5px; }
  .bico { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; flex: none; }
  .forks-indent { margin-left: 14px; border-left: 1px solid var(--line); padding-left: 4px; }
  .gitline { display: flex; align-items: center; gap: 8px; margin-top: 6px; padding: 9px 8px 5px; border-top: 1px solid var(--line); font-size: 12px; }
  .gitline .t { flex: 1; color: var(--muted); }
  .gitline .t b { color: var(--text); font-weight: 600; display: block; }
  .lnk { color: var(--accent); cursor: pointer; background: none; border: 0; padding: 0; font-size: 12px; }

  /* ---- Canvas ---- */
  .canvas { position: relative; flex: 1; overflow: hidden; background: var(--bg); cursor: grab; }
  .canvas.drag { cursor: grabbing; }
  .world { position: absolute; left: 0; top: 0; background-image: radial-gradient(#232833 1px, transparent 1px); background-size: 24px 24px; }
  .crumbs { position: absolute; left: 16px; top: 14px; display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 12px; z-index: 3; }
  .crumbs a { cursor: pointer; } .crumbs a:hover { color: var(--text); } .crumbs .cur { color: var(--text); font-weight: 600; }
  .box { position: absolute; width: 190px; height: 74px; border-radius: 10px; border: 1px solid #2a303c; background: #181c24; padding: 10px 12px; cursor: pointer; }
  .box:hover { border-color: #3d4656; }
  .box .n { font-weight: 600; display: flex; align-items: center; gap: 7px; }
  .box .s { color: var(--muted); font-size: 11.5px; margin-top: 3px; }
  .box .in { position: absolute; left: 12px; bottom: 7px; font-size: 10.5px; color: #6b7486; }
  .box.add { border-color: var(--add); } .box.mod { border-color: var(--mod); } .box.del { border-color: var(--del); border-style: dashed; opacity: .55; }
  .frame { position: absolute; border: 1px dashed #2b3240; border-radius: 14px; }
  .frame span { position: absolute; left: 14px; top: 9px; color: #aeb6c6; font-size: 12.5px; }

  /* Minimap: macro (folders) + micro (this diagram) */
  .mm { position: absolute; right: 16px; bottom: 16px; width: 272px; background: var(--panel); border: 1px solid var(--line-strong); border-radius: 12px; z-index: 5; box-shadow: 0 10px 30px rgba(0,0,0,.45); overflow: hidden; }
  .mm-head { display: flex; align-items: center; gap: 6px; padding: 7px 8px 7px 10px; border-bottom: 1px solid var(--line); }
  .mm-head .t { flex: 1; font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .mm-seg { display: flex; background: var(--field); border-radius: 7px; padding: 2px; }
  .mm-seg button { border: 0; background: none; color: var(--muted); font-size: 11px; padding: 2px 7px; border-radius: 5px; cursor: pointer; }
  .mm-seg button.on { background: #2a3140; color: var(--text); }
  .lvl { padding: 5px 10px 0; }
  .lvl .of { font-size: 10px; color: var(--faint); margin-bottom: 3px; display: flex; gap: 4px; align-items: center; cursor: pointer; }
  .lvl .of:hover { color: var(--text); }
  .chips { display: flex; gap: 3px; }
  .chip { flex: 1 1 0; min-width: 6px; height: 18px; border-radius: 4px; background: #222833; font-size: 10px; color: var(--faint); padding: 0 5px; overflow: hidden; white-space: nowrap; text-overflow: clip; line-height: 18px; cursor: pointer; }
  .chip:hover { background: #2c3442; color: var(--text); }
  .chip.on { flex: 0 0 auto; background: #2e4470; color: #fff; font-weight: 600; text-overflow: ellipsis; max-width: 60%; }
  .chip.ch { box-shadow: inset 0 -2px 0 var(--mod); }
  .micro { position: relative; margin: 8px 10px 10px; border-radius: 8px; background: #0c0e12; border: 1px solid var(--line); overflow: hidden; cursor: crosshair; }
  .micro .mb { position: absolute; border-radius: 2px; background: #3a4352; }
  .micro .mb.add { background: var(--add); } .micro .mb.mod { background: var(--mod); }
  .micro .vp { position: absolute; border: 1.5px solid var(--accent); background: rgba(79,140,255,.10); border-radius: 3px; pointer-events: none; }
  .micro .here-l { position: absolute; left: 6px; top: 4px; font-size: 10px; color: var(--muted); pointer-events: none; }
  .fold { padding: 6px; }
  .fold .row { height: 24px; }

  /* ---- Dialogs ---- */
  .scrim { position: fixed; inset: 0; background: rgba(5,7,10,.6); backdrop-filter: blur(3px); display: none; place-items: center; z-index: 50; }
  .scrim.on { display: grid; }
  .dialog { width: 500px; max-width: calc(100vw - 32px); background: #161a21; border: 1px solid var(--line-strong); border-radius: 14px; box-shadow: 0 30px 80px rgba(0,0,0,.6); overflow: hidden; }
  .dialog.wide { width: 760px; }
  .d-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .d-head b { font-size: 15px; flex: 1; }
  .d-body { padding: 14px 16px; display: flex; flex-direction: column; gap: 14px; max-height: 72vh; overflow: auto; }
  .d-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }
  .btn { border: 1px solid var(--line-strong); background: var(--field); border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 12.5px; }
  .btn:hover { border-color: #4a5466; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field > span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
  .opts { display: flex; flex-wrap: wrap; gap: 6px; }
  .opt { border: 1px solid var(--line-strong); background: var(--field); border-radius: 8px; padding: 6px 10px; cursor: pointer; color: var(--muted); }
  .opt.on { border-color: var(--accent); color: var(--text); background: rgba(79,140,255,.12); }
  .card { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; gap: 10px; align-items: center; background: #191d25; }
  .card .grow { flex: 1; } .card small { display: block; color: var(--muted); font-size: 11.5px; }
  .choice { border: 1px solid var(--line-strong); border-radius: 10px; padding: 12px; cursor: pointer; display: flex; gap: 12px; align-items: flex-start; }
  .choice:hover { border-color: var(--accent); }
  .choice small { display: block; color: var(--muted); margin-top: 2px; }

  /* ---- Diff gallery ---- */
  .gallery { flex: 1; overflow: auto; padding: 22px; }
  .gallery h2 { margin: 0 0 4px; font-size: 18px; }
  .gallery .lead { color: var(--muted); margin: 0 0 18px; max-width: 760px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 16px; }
  .ex { background: #141820; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; }
  .ex-h { padding: 12px 14px 8px; }
  .ex-h b { font-size: 14px; } .ex-h .num { color: var(--faint); margin-right: 6px; }
  .ex-h p { margin: 3px 0 0; color: var(--muted); font-size: 12px; }
  .ex-b { padding: 10px 14px 14px; flex: 1; }
  .mini { position: relative; background-color: #0c0e12; background-image: radial-gradient(#1d222b 1px, transparent 1px); background-size: 14px 14px; border-radius: 10px; border: 1px solid var(--line); overflow: hidden; }
  .mini .mx { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .mbox { position: absolute; width: 140px; height: 46px; border-radius: 8px; border: 1px solid #2a303c; background: #181c24; padding: 6px 9px; font-size: 12px; font-weight: 600; }
  .mbox small { display: block; font-weight: 400; color: var(--muted); font-size: 10.5px; }
  .mbox.add { border-color: var(--add); box-shadow: 0 0 0 3px rgba(52,211,153,.14); }
  .mbox.mod { border-color: var(--mod); box-shadow: 0 0 0 3px rgba(251,191,36,.14); }
  .mbox.move { border-color: var(--move); box-shadow: 0 0 0 3px rgba(96,165,250,.14); }
  .mbox.del { border-color: var(--del); border-style: dashed; opacity: .55; background: transparent; }
  .mbox.del b { text-decoration: line-through; }
  .mbox.ghost { border-style: dashed; border-color: var(--move); opacity: .35; background: transparent; }
  .mbox.dim { opacity: .45; }
  .mbox .tg { position: absolute; right: 6px; top: -8px; font-size: 9px; font-weight: 700; padding: 0 5px; border-radius: 5px; color: #0f1115; }
  .mbox.add .tg { background: var(--add); } .mbox.mod .tg { background: var(--mod); } .mbox.move .tg { background: var(--move); } .mbox.del .tg { background: var(--del); }
  .mbox .who { position: absolute; right: -7px; bottom: -7px; width: 16px; height: 16px; border-radius: 8px; font-size: 9px; font-weight: 700; display: grid; place-items: center; color: #0f1115; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .pair .cap { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 4px; }
  .swipe { position: relative; }
  .swipe .top { position: absolute; inset: 0; }
  .swipe .bar { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--accent); pointer-events: none; }
  .swipe .lab { position: absolute; top: 6px; font-size: 10px; padding: 1px 6px; border-radius: 5px; background: #222833; color: var(--muted); }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .props { border: 1px solid var(--line); border-radius: 10px; background: #181c24; overflow: hidden; }
  .props .ph { display: flex; gap: 8px; align-items: center; padding: 9px 12px; border-bottom: 1px solid var(--line); font-weight: 600; }
  .prow { display: grid; grid-template-columns: 82px 1fr; gap: 8px; padding: 7px 12px; border-bottom: 1px solid #1f242d; font-size: 12px; }
  .prow:last-child { border-bottom: 0; }
  .prow > span:first-child { color: var(--faint); }
  del { color: var(--del); background: rgba(248,113,113,.12); text-decoration: line-through; border-radius: 3px; padding: 0 2px; }
  ins { color: var(--add); background: rgba(52,211,153,.12); text-decoration: none; border-radius: 3px; padding: 0 2px; }
  pre.yd { margin: 0; font: 11.5px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; background: #0c0e12; border: 1px solid var(--line); border-radius: 10px; padding: 8px 0; overflow: auto; }
  pre.yd div { padding: 0 12px; white-space: pre; }
  pre.yd .a { background: rgba(52,211,153,.10); color: #a7f3d0; } pre.yd .r { background: rgba(248,113,113,.10); color: #fecaca; } pre.yd .h { color: var(--faint); }
  .clist { display: flex; flex-direction: column; gap: 4px; }
  .crow { display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 8px; background: #191d25; font-size: 12.5px; }
  .crow .wh { color: var(--muted); font-size: 11px; }
  .crow .grow { flex: 1; min-width: 0; }
  .crow .av { width: 18px; height: 18px; border-radius: 9px; display: grid; place-items: center; font-size: 9px; font-weight: 700; color: #0f1115; flex: none; }
  .crow .acts { display: flex; gap: 4px; }
  .crow .acts button { border: 1px solid var(--line-strong); background: none; border-radius: 6px; width: 24px; height: 22px; cursor: pointer; color: var(--muted); font-size: 12px; }
  .crow.ok { opacity: .55; } .crow.ok .acts .y { background: var(--add); color: #0f1115; border-color: var(--add); }
  .crow.no { opacity: .55; text-decoration: line-through; } .crow.no .acts .n { background: var(--del); color: #0f1115; border-color: var(--del); }
  .grp { font-size: 10.5px; color: var(--faint); text-transform: uppercase; letter-spacing: .05em; margin: 6px 2px 2px; }
  .ticks { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 2px; }
  .ticks span.on { color: var(--text); font-weight: 600; }
  .summary { display: flex; gap: 6px; flex-wrap: wrap; }
  .summary .pill { display: flex; gap: 6px; align-items: center; padding: 6px 10px; border-radius: 9px; background: #191d25; border: 1px solid var(--line); font-size: 12px; }
  .note { margin-top: 8px; font-size: 11.5px; color: var(--muted); }

  /* ---- Git-style changes on boxes ---- */
  .box { height: auto; min-height: 74px; }
  .box.sel { outline: 2px solid var(--accent); outline-offset: 2px; }
  .box.add { border-color: var(--add); background: rgba(52,211,153,.06); }
  .box.mod { border-color: rgba(251,191,36,.75); }
  .box.del { border: 1.5px dashed rgba(248,113,113,.8); background: transparent; opacity: .42; }
  .box.del .n { text-decoration: line-through; }
  .gb { position: absolute; right: 8px; top: -9px; font-size: 10px; font-weight: 700; padding: 0 6px; border-radius: 6px; background: #0f1115; border: 1px solid var(--line-strong); line-height: 16px; }
  .gb.add { color: var(--add); border-color: var(--add); } .gb.del { color: var(--del); border-color: var(--del); } .gb.mod { border-color: rgba(251,191,36,.75); }
  .gb i { color: var(--add); font-style: normal; } .gb u { color: var(--del); text-decoration: none; }
  .dl { margin-top: 6px; font: 10.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; border-radius: 5px; overflow: hidden; }
  .dl div { padding: 0 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dl .a { background: rgba(52,211,153,.11); color: #a7f3d0; }
  .dl .r { background: rgba(248,113,113,.07); color: #fca5a5; opacity: .6; text-decoration: line-through; }
  .mbox.gmod, .mbox.gadd, .mbox.gdel { height: auto; min-height: 46px; }
  .mbox.gadd { border-color: var(--add); background: #15201c; }
  .mbox.gmod { border-color: rgba(251,191,36,.75); }
  .mbox.gdel { border: 1.5px dashed rgba(248,113,113,.8); opacity: .42; background: transparent; }
  .mbox.gdel b { text-decoration: line-through; }
  .mbox .gb { top: -8px; right: 6px; font-size: 9px; line-height: 14px; }
  .mbox .dl { font-size: 9.5px; margin-top: 4px; font-weight: 400; }
  .row.sel .label { color: var(--accent); }
  .row.gone { opacity: .5; } .row.gone .label { text-decoration: line-through; }
  .near::-webkit-scrollbar, .mm::-webkit-scrollbar { height: 6px; width: 6px; } .near::-webkit-scrollbar-thumb, .mm::-webkit-scrollbar-thumb { background: #2a303c; border-radius: 3px; } .near::-webkit-scrollbar-track, .mm::-webkit-scrollbar-track { background: transparent; }
  .near { scrollbar-width: thin; scrollbar-color: #2a303c transparent; }

  /* ---- Minimap stack: the diagrams around you, as small layouts ---- */
  .mm { width: 300px; max-height: calc(100% - 70px); overflow: auto; }
  .mm-sec { padding: 8px 10px 0; }
  .mm-sec:last-child { padding-bottom: 10px; }
  .mm-sec .of { font-size: 10.5px; color: var(--muted); margin-bottom: 4px; display: flex; gap: 5px; align-items: center; cursor: pointer; }
  .mm-sec .of:hover { color: var(--text); }
  .mm-sec .of.here { color: var(--text); font-weight: 600; cursor: default; }
  .mm-sec .of .c { margin-left: auto; color: var(--faint); font-weight: 400; }
  .thumb { position: relative; overflow: hidden; border-radius: 7px; background: #0c0e12; border: 1px solid var(--line); }
  .thumb.up { cursor: pointer; opacity: .8; } .thumb.up:hover { opacity: 1; border-color: var(--line-strong); }
  .tin { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .tb { position: absolute; width: 72px; height: 28px; border-radius: 4px; border: 1px solid #303846; background: #1a1f28; font-size: 8.5px; line-height: 1.15; padding: 3px 4px; overflow: hidden; color: #c5ccd8; }
  .tb i { display: block; width: 5px; height: 5px; border-radius: 2px; margin-bottom: 2px; }
  .tb span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tb.lit { border-color: var(--accent); background: #1d2c4a; color: #fff; }
  .tb.add { border-color: var(--add); } .tb.mod { border-color: rgba(251,191,36,.8); } .tb.del { border-style: dashed; border-color: var(--del); opacity: .45; }
  .tb.go { cursor: pointer; } .tb.go:hover { border-color: #5a6578; }
  .tf { position: absolute; border: 1px dashed #2b3240; border-radius: 6px; }
  .tf span { position: absolute; left: 4px; top: 1px; font-size: 7.5px; color: var(--faint); }
  #micro { cursor: crosshair; }
  #micro .vp { position: absolute; border: 1.5px solid var(--accent); background: rgba(79,140,255,.08); border-radius: 3px; pointer-events: none; }

<script>
const ic = (n, s = 16) => `<svg class="i" style="width:${s}px;height:${s}px"><use href="#i-${n}"/></svg>`;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const kc = (k) => `var(--${k === "landscape" ? "system" : k})`;

// ---- The design ------------------------------------------------------------------------------
const T = (id, name, kind, kids = [], x = {}) => ({ id, name, kind, kids, ...x });
const tree = T("landscape", "Orbit Coffee", "landscape", [
  T("customer", "Customer", "actor"), T("barista", "Barista", "actor"), T("ops", "Ops team", "actor"),
  T("orbit", "Orbit Platform", "system", [
    T("clients", "Clients", "group", [T("mobile", "Mobile App", "app"), T("tablet", "Store Tablet", "app"), T("admin", "Web Admin", "app")]),
    T("gateway", "API Gateway", "app"),
    T("orders", "Orders Service", "app", [
      T("order-api", "Order API", "component", [T("http-rs", "http.rs", "module", [T("create", "create_order()", "function"), T("get", "get_order()", "function"), T("cancel", "cancel_order()", "function")])]),
      T("pricing", "Pricing Engine", "component", [T("pricing-rs", "pricing.rs", "module", [T("price", "price_cart()", "function"), T("promos", "apply_promos()", "function"), T("tax", "tax_for()", "function")])]),
      T("payment", "Payment Adapter", "component", [T("payments-rs", "payments.rs", "module", [T("charge", "charge()", "function"), T("refund", "refund()", "function"), T("webhook", "verify_webhook()", "function")])]),
      T("state", "Order State Machine", "component", [T("state-rs", "state.rs", "module", [T("advance", "advance()", "function"), T("publish", "publish_change()", "function")])]),
    ]),
    T("menu", "Menu Service", "app"), T("notify", "Notify Worker", "app"), T("loyalty", "Loyalty Service", "app"),
    T("data", "Data", "group", [
      T("orders-db", "Orders DB", "store", [T("t-customers", "customers", "table"), T("t-orders", "orders", "table"), T("t-items", "order_items", "table"), T("t-payments", "payments", "table")]),
      T("menu-cache", "Menu Cache", "store"), T("events", "Order Events", "store"), T("receipts", "Receipts Bucket", "store"),
    ]),
  ]),
  T("stripe", "Stripe", "system", [], { external: true }), T("twilio", "Twilio", "system", [], { external: true }), T("mapbox", "Mapbox", "system", [], { external: true }),
]);
const forks = [
  { id: "zeek-idem", name: "zeek/idempotency", who: "You", av: "Z", color: "#4f8cff", note: "6 changes · saved",
    changes: { "order-api": "mod", payment: "mod", state: "del", guard: "add", create: "mod", charge: "mod" },
    adds: { orders: [T("guard", "Idempotency Guard", "component")] },
    lines: { "order-api": [["-", "Rust, Axum"], ["+", "Rust, Axum, tower"], ["+", "calls Idempotency Guard"]], payment: [["-", "async-stripe 0.37"], ["+", "async-stripe 0.39"]],
      create: [["+", "checks the key first"]], charge: [["-", "charges per call"], ["+", "charges once per key"]] } },
  { id: "agent-loyalty", name: "agent/loyalty-v1", who: "Claude", av: "C", color: "#a78bfa", note: "6 changes · pull request #12", changes: { loyalty: "mod", gateway: "mod" } },
  { id: "sam-eu", name: "sam/eu-region", who: "Sam", av: "S", color: "#34d399", note: "3 changes · 2 behind main", changes: { tax: "mod", "orders-db": "mod", mapbox: "del" } },
];
const S = { here: "orders", sel: null, fork: "main", view: "tree", open: new Set(["landscape", "orbit", "orders", "data"]), git: "local", mm: "stack", pan: { x: 0, y: 0 }, cw: 0, ch: 0 };
const forkOf = () => forks.find((f) => f.id === S.fork);
/** A box's children, with what the fork you're on adds. */
const kidsOf = (n) => [...n.kids, ...((forkOf()?.adds || {})[n.id] || [])];
const byId = new Map(), parentOf = new Map();
function reindex() { byId.clear(); parentOf.clear(); (function walk(n, p) { byId.set(n.id, n); if (p) parentOf.set(n.id, p.id); kidsOf(n).forEach((k) => walk(k, n)); })(tree, null); }
reindex();
const pathTo = (id) => { const o = []; for (let c = id; c; c = parentOf.get(c)) o.unshift(c); return o; };
/** Go to a diagram: its folders open in the tree, the canvas back at the start. */
function go(id, sel = null) { const n = byId.get(id); if (!n) return; if (n.kind === "group") return go(parentOf.get(id), sel); S.here = id; S.sel = sel; S.pan = { x: 0, y: 0 }; for (const p of pathTo(id)) S.open.add(p); closeDialog(); render(); }
const changeOf = (id) => forkOf()?.changes[id];
function rolled(n) { const f = forkOf(); if (!f) return 0; let c = 0; (function w(x) { kidsOf(x).forEach((k) => { if (f.changes[k.id]) c++; w(k); }); })(n); return c; }

// ---- Git status --------------------------------------------------------------------------------
const GIT = {
  local: { icon: "disk", cls: "git-local", title: "Local history", line: "Kept in a git repo on this machine", act: "Connect a repo…" },
  github: { icon: "cloud", cls: "git-github", title: "orbit-coffee/platform", line: "GitHub · synced 2 min ago", act: "Sync now" },
  syncing: { icon: "sync", cls: "git-syncing", title: "orbit-coffee/platform", line: "Syncing…", act: null },
  error: { icon: "alert", cls: "git-error", title: "Can't push to GitHub", line: "The sign-in expired · forks are saved here meanwhile", act: "Reconnect" },
};

// ---- Panel -------------------------------------------------------------------------------------
function panel() {
  const f = forkOf();
  const g = GIT[S.git];
  const tool = (v, i, t) => `<button class="ib${S.view === v ? " on" : ""}" data-view="${v}" title="${t}">${ic(i)}</button>`;
  return `<div class="p-top">
      <button class="branch" id="branchBtn" title="Branches">
        <span style="color:${f ? f.color : "var(--muted)"}">${ic("branch", 15)}</span>
        <span class="nm">${f ? esc(f.name) : "main"}</span>
        ${f ? "" : `<span class="forks">${forks.length} forks</span>`}<span class="car">▾</span></button>
      <button class="ib ${g.cls}" data-dialog="git" title="${esc(g.title)}: ${esc(g.line)}">${ic(g.icon)}</button>
      <button class="ib" data-dialog="settings" title="Settings">${ic("cog")}</button>
    </div>
    <div class="tools">${tool("tree", "tree", "Tree")}${tool("modules", "code", "Modules")}
      <span class="div"></span>
      <button class="ib" data-dialog="changes" title="Changes">${ic("diff")}${f ? `<span class="pip" style="background:var(--mod)"></span>` : `<span class="pip" style="background:var(--accent)"></span>`}</button>
      <button class="ib" data-dialog="history" title="History">${ic("clock")}</button>
      <span style="flex:1"></span><button class="ib" title="Find (⌘K)">${ic("search")}</button></div>
    <div class="p-body">${S.view === "tree" ? rows(tree.kids, 0) : modules()}</div>`;
}
function mark(n) {
  const c = changeOf(n.id);
  const lines = (forkOf()?.lines || {})[n.id];
  if (c === "mod" && lines) { const a = lines.filter((l) => l[0] === "+").length; return `<span class="mk" style="background:none;padding:0"><span style="color:var(--add)">+${a}</span> <span style="color:var(--del)">−${lines.length - a}</span></span>`; }
  if (c) return `<span class="mk ${c}">${c === "add" ? "+" : c === "del" ? "−" : "~"}</span>`;
  const r = !S.open.has(n.id) && rolled(n);
  return r ? `<span class="mk mod">${r}</span>` : "";
}
function rows(list, d) {
  return list.map((k) => {
    const open = S.open.has(k.id), has = kidsOf(k).length > 0;
    return `<div class="row${S.here === k.id ? " here" : ""}${S.sel === k.id ? " sel" : ""}${changeOf(k.id) === "del" ? " gone" : ""}" data-row="${k.id}" title="${has ? "Open" : "Show it"}" style="padding-left:${6 + d * 13}px">
      <span class="chev" data-tog="${k.id}">${has ? (open ? "▾" : "▸") : ""}</span><span class="dot" style="background:${kc(k.kind)};${k.external ? "opacity:.45" : ""}"></span>
      <span class="label">${esc(k.name)}</span>${mark(k)}</div>${open && has ? rows(kidsOf(k), d + 1) : ""}`;
  }).join("");
}
function modules() {
  const libs = [["axum", 5], ["sqlx", 5], ["tokio", 3], ["async-stripe", 6], ["redis", 2], ["serde", 1]];
  return `<div class="sect">orbit (repo)</div>${rows(byId.get("orders").kids.map((c) => c.kids[0]), 0)}
    <div class="sect">Libraries</div>${libs.map(([n, u]) => `<div class="row"><span class="chev"></span><span class="dot" style="background:var(--library)"></span><span class="label">${n}</span><span style="font-size:10.5px;color:var(--faint)">${u}</span></div>`).join("")}`;
}

// ---- Branch popover: main always on top, forks under it, git at the bottom ----------------------
function branchPop() {
  const g = GIT[S.git];
  const item = (f) => `<div class="bitem${S.fork === f.id ? " on" : ""}" data-fork="${f.id}">
      <span class="bico" style="background:${f.color}22;color:${f.color}">${ic("branch", 13)}</span>
      <span class="meta"><b>${esc(f.name)}</b><small>${esc(f.who)} · ${esc(f.note)}</small></span></div>`;
  return `<div class="bitem${S.fork === "main" ? " on" : ""}" data-fork="main">
      <span class="bico" style="background:#232a36;color:var(--text)">${ic("branch", 13)}</span>
      <span class="meta"><b>main</b><small>What everyone sees</small></span></div>
    <div class="forks-indent">${forks.map(item).join("")}
      <div class="bitem" data-dialog="newfork" style="color:var(--muted)"><span class="bico">${ic("plus", 13)}</span><span class="meta">New fork</span></div></div>
    <div class="gitline"><span class="${g.cls}">${ic(g.icon, 15)}</span><span class="t"><b>${esc(g.title)}</b>${esc(g.line)}</span>${g.act ? `<button class="lnk" data-dialog="git">${g.act}</button>` : ""}</div>`;
}

// ---- Canvas + minimap ----------------------------------------------------------------------------
const X0 = 120, CX = 250, RY = 150, ORG = X0 - 20;
/** Boxes three to a row, each group a frame of its own below: world coordinates. */
function layout(n) {
  const out = { boxes: [], frames: [] };
  const kids = kidsOf(n), loose = kids.filter((k) => k.kind !== "group"), groups = kids.filter((k) => k.kind === "group");
  loose.forEach((k, i) => out.boxes.push({ n: k, x: X0 + (i % 3) * CX, y: X0 + Math.floor(i / 3) * RY }));
  let gy = X0 + Math.ceil(loose.length / 3) * RY + (loose.length ? 10 : 0);
  groups.forEach((g) => {
    const gk = kidsOf(g), rowsN = Math.max(1, Math.ceil(gk.length / 3));
    const w = (Math.min(3, Math.max(1, gk.length)) - 1) * CX + 190 + 40, h = (rowsN - 1) * RY + 74 + 64;
    out.frames.push({ n: g, x: ORG, y: gy, w, h });
    gk.forEach((k, i) => out.boxes.push({ n: k, x: X0 + (i % 3) * CX, y: gy + 44 + Math.floor(i / 3) * RY }));
    gy += h + 40;
  });
  const r = Math.max(X0 + 190, ...out.boxes.map((b) => b.x + 190), ...out.frames.map((f) => f.x + f.w));
  const b = Math.max(X0 + 74, ...out.boxes.map((b) => b.y + 74), ...out.frames.map((f) => f.y + f.h));
  out.cw = r - ORG + 20; out.ch = b - ORG + 20;
  out.w = Math.max(1700, r + 500); out.h = Math.max(1100, b + 400);
  return out;
}
/** A box as git would show it: + new, dotted and faded when it's gone here but still on main, +n −n with its lines when changed. */
function boxHtml(k, x, y) {
  const c = changeOf(k.id), lines = (forkOf()?.lines || {})[k.id] || [];
  const plus = lines.filter((l) => l[0] === "+").length, minus = lines.length - plus;
  const badge = c === "add" ? `<span class="gb add">+ new</span>` : c === "del" ? `<span class="gb del">− deleted</span>` : c === "mod" ? `<span class="gb mod"><i>+${plus}</i> <u>−${minus}</u></span>` : "";
  const dl = c === "mod" && lines.length ? `<div class="dl">${lines.map(([sg, t]) => `<div class="${sg === "+" ? "a" : "r"}">${sg === "+" ? "+" : "−"} ${esc(t)}</div>`).join("")}</div>` : "";
  const inside = kidsOf(k).length;
  const sub = c === "del" ? "still on main" : `${k.kind}${k.external ? " · external" : ""}`;
  return `<div class="box ${c || ""}${S.sel === k.id ? " sel" : ""}" style="left:${x}px;top:${y}px" data-go="${inside ? k.id : ""}">${badge}
    <div class="n"><span class="dot" style="background:${kc(k.kind)}"></span>${esc(k.name)}</div><div class="s">${sub}</div>${dl}${inside && !dl ? `<span class="in">${inside} inside →</span>` : ""}</div>`;
}
let L = null;
function canvas() {
  const n = byId.get(S.here);
  L = layout(n);
  const world = document.getElementById("world");
  world.style.width = L.w + "px"; world.style.height = L.h + "px";
  world.innerHTML = L.frames.map((f) => `<div class="frame" style="left:${f.x}px;top:${f.y}px;width:${f.w}px;height:${f.h}px"><span>${esc(f.n.name)}</span></div>`).join("") +
    L.boxes.map(({ n: k, x, y }) => boxHtml(k, x, y)).join("");
  const p = pathTo(S.here);
  document.getElementById("crumbs").innerHTML = p.map((id, i) => i === p.length - 1 ? `<span class="cur">${esc(byId.get(id).name)}</span>` : `<a data-go="${id}">${esc(byId.get(id).name)}</a><span>›</span>`).join(" ");
  minimap();
  pan();
}
// Thumbnails: the same layout at 1/F, boxes small enough to read a name.
const F = CX / 95;
function thumb(n, { maxW, maxH, lit = null, cls = "", links = false }) {
  const l = layout(n), cw = l.cw / F, ch = l.ch / F, s = Math.min(1, maxW / cw, maxH / ch);
  const t = (v) => (v - ORG) / F;
  const inner = l.frames.map((f) => `<div class="tf" style="left:${t(f.x)}px;top:${t(f.y)}px;width:${f.w / F}px;height:${f.h / F}px"><span>${esc(f.n.name)}</span></div>`).join("") +
    l.boxes.map(({ n: k, x, y }) => { const c = changeOf(k.id), go = links && kidsOf(k).length; return `<div class="tb${k.id === lit ? " lit" : ""}${c ? " " + c : ""}${go ? " go" : ""}" style="left:${t(x)}px;top:${t(y)}px"${go ? ` data-go="${k.id}" title="Open ${esc(k.name)}"` : ""}><i style="background:${kc(k.kind)}"></i><span>${esc(k.name)}</span></div>`; }).join("");
  return { s, html: `<div class="thumb ${cls}" style="width:${cw * s}px;height:${ch * s}px"><div class="tin" style="width:${cw}px;height:${ch}px;transform:scale(${s})">${inner}</div>${cls === "here" ? `<div class="vp" id="vp"></div>` : ""}</div>` };
}
/** Diagrams worth jumping to from here: what opens from this one, then its neighbours. */
function nearby(n) {
  const flat = (list) => list.flatMap((k) => (k.kind === "group" ? kidsOf(k) : [k])).filter((k) => kidsOf(k).length);
  const pid = parentOf.get(n.id);
  return [...flat(kidsOf(n)).map((k) => ({ k, rel: "in" })), ...(pid ? flat(kidsOf(byId.get(pid))).filter((k) => k.id !== n.id).map((k) => ({ k, rel: "by" })) : [])];
}
let TS = 1;
function minimap() {
  const n = byId.get(S.here), p = pathTo(S.here), pid = parentOf.get(S.here);
  const seg = ["folders", "stack"].map((m) => `<button data-mm="${m}" class="${S.mm === m ? "on" : ""}">${m === "folders" ? "Folders" : "Map"}</button>`).join("");
  let body = "";
  if (S.mm === "folders") {
    body = `<div class="fold">${p.map((id, i) => { const x = byId.get(id); return `<div class="row${id === S.here ? " here" : ""}" data-go="${id}" style="padding-left:${6 + i * 12}px"><span style="color:${id === S.here ? "var(--accent)" : "var(--faint)"}">${ic("folder", 13)}</span><span class="label">${esc(x.name)}</span><span style="font-size:10.5px;color:var(--faint)">${kidsOf(x).length}</span></div>`; }).join("")}</div>`;
  } else {
    if (pid) { const up = byId.get(pid); body += `<div class="mm-sec"><div class="of" data-go="${pid}">↑ ${esc(up.name)}</div><div data-go="${pid}" title="Back up to ${esc(up.name)}">${thumb(up, { maxW: 278, maxH: 120, lit: S.here, cls: "up" }).html}</div></div>`; }
    const here = thumb(n, { maxW: 278, maxH: 230, cls: "here", links: true });
    TS = here.s;
    body += `<div class="mm-sec"><div class="of here">${esc(n.name)}<span class="c">${L.boxes.length} boxes</span></div><div id="micro">${here.html}</div></div>`;
    const near = nearby(n);

  }

}
function pan() {

}

const before = {
  boxes: { gateway: { name: "API Gateway", kind: "app", x: 20, y: 30 }, api: { name: "Order API", kind: "component", x: 210, y: 30, tech: "Rust, Axum" }, pricing: { name: "Pricing Engine", kind: "component", x: 210, y: 120 },
    payment: { name: "Payment Adapter", kind: "component", x: 400, y: 30, tech: "async-stripe" }, db: { name: "Orders DB", kind: "store", x: 400, y: 120, tech: "Postgres" }, mapbox: { name: "Mapbox", kind: "system", x: 20, y: 120 } },
  edges: [["gateway", "api"], ["api", "pricing"], ["api", "payment"], ["api", "db"], ["gateway", "mapbox"]],
};
const after = {
  boxes: { gateway: before.boxes.gateway, api: { ...before.boxes.api, tech: "Rust, Axum, tower" }, pricing: { ...before.boxes.pricing, x: 20, y: 210 },
    payment: { ...before.boxes.payment, tech: "async-stripe 0.39" }, db: before.boxes.db, idem: { name: "Idempotency Keys", kind: "store", x: 210, y: 210, tech: "Postgres table" } },
  edges: [["gateway", "api"], ["api", "pricing"], ["api", "payment"], ["api", "db"], ["api", "idem"]],
};
const middle = { boxes: { ...before.boxes, idem: after.boxes.idem }, edges: [...before.edges, ["api", "idem"]] };
const WHO = { api: ["Z", "#4f8cff"], payment: ["C", "#a78bfa"], idem: ["Z", "#4f8cff"], pricing: ["S", "#34d399"], mapbox: ["S", "#34d399"] };
function diffOf(a, b) {
  const st = {};
  for (const id in b.boxes) { const x = a.boxes[id], y = b.boxes[id]; if (!x) st[id] = "add"; else if (x.x !== y.x || x.y !== y.y) st[id] = "move"; else if (x.tech !== y.tech || x.name !== y.name) st[id] = "mod"; }
  for (const id in a.boxes) if (!b.boxes[id]) st[id] = "del";
  const key = (e) => e.join(">"), ae = new Set(a.edges.map(key)), be = new Set(b.edges.map(key));
  return { st, addE: b.edges.filter((e) => !ae.has(key(e))).map(key), delE: a.edges.filter((e) => !be.has(key(e))).map(key) };
}
const BW = 140, BH = 46, MW = 560, MH = 270;
function clip(c1, c2) { const dx = c2.x - c1.x, dy = c2.y - c1.y; const t = Math.min(Math.abs((BW / 2 + 4) / (dx || 1e-9)), Math.abs((BH / 2 + 4) / (dy || 1e-9))); return { x: c2.x - dx * t, y: c2.y - dy * t }; }
const ctr = (b) => ({ x: b.x + BW / 2, y: b.y + BH / 2 });
function line(a, b, color, dash) { const p = clip(ctr(b), ctr(a)), q = clip(ctr(a), ctr(b)); return `<line x1="${p.x}" y1="${p.y}" x2="${q.x}" y2="${q.y}" stroke="${color}" stroke-width="1.6" ${dash ? 'stroke-dasharray="5 4"' : ""} marker-end="url(#ah-${color.replace(/[^a-z0-9]/gi, "")})"/>`; }
function markers(colors) { return `<defs>${colors.map((c) => `<marker id="ah-${c.replace(/[^a-z0-9]/gi, "")}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${c}"/></marker>`).join("")}</defs>`; }
const C = { base: "#4a5466", add: "#34d399", del: "#f87171", move: "#60a5fa" };
/** mode: plain (one state) | overlay (b, with what changed from a) | moves (overlay plus where moved boxes were) */
function mini(a, b, mode, width, opts = {}) {
  const s = width / MW, d = diffOf(a, b);
  const st = mode === "plain" ? {} : d.st;
  const show = mode === "plain" ? b : { boxes: { ...b.boxes, ...Object.fromEntries(Object.entries(a.boxes).filter(([id]) => !b.boxes[id])) }, edges: b.edges };
  let svg = markers(Object.values(C));
  for (const e of show.edges) { const k = e.join(">"); svg += line(show.boxes[e[0]], show.boxes[e[1]], mode !== "plain" && d.addE.includes(k) ? C.add : C.base); }
  if (mode !== "plain") for (const k of d.delE) { const [x, y] = k.split(">"); svg += line(a.boxes[x], a.boxes[y], C.del, true); }
  let ghosts = "";
  if (mode === "moves" || mode === "git") for (const id in st) if (st[id] === "move") { const o = a.boxes[id], nb = b.boxes[id]; ghosts += `<div class="mbox ghost" style="left:${o.x}px;top:${o.y}px"><b>${esc(o.name)}</b></div>`; svg += `<line x1="${o.x + BW / 2}" y1="${o.y + BH / 2}" x2="${nb.x + BW / 2 + 30}" y2="${nb.y + BH / 2}" stroke="${C.move}" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#ah-${C.move.replace("#", "")})"/>`; }
  const boxes = Object.entries(show.boxes).map(([id, bx]) => { const c = st[id];
    if (mode === "git") return gitBox(id, bx, c, a.boxes[id]);
    const label = { add: "new", mod: "changed", move: "moved", del: "removed" }[c];
    const dim = opts.focus && !c ? " dim" : "";
    const who = opts.who && c && WHO[id] ? `<span class="who" style="background:${WHO[id][1]}">${WHO[id][0]}</span>` : "";
    return `<div class="mbox ${c || ""}${dim}" style="left:${bx.x}px;top:${bx.y}px">${c ? `<span class="tg">${label}</span>` : ""}<b>${esc(bx.name)}</b><small>${esc(bx.tech || bx.kind)}</small>${who}</div>`; }).join("");
  return `<div class="mini" style="height:${MH * s}px"><div class="mx" style="width:${MW}px;height:${MH}px;transform:scale(${s})">${ghosts}<svg width="${MW}" height="${MH}" style="position:absolute;inset:0">${svg}</svg>${boxes}</div></div>`;
}
/** The git look for the small diagrams: + new, −/dotted for gone, +n −n with the lines for changed. */
function gitBox(id, bx, c, was) {
  const lines = c === "mod" ? [["-", was.tech], ["+", bx.tech]] : [];
  const cls = c === "add" ? "gadd" : c === "del" ? "gdel" : c === "mod" ? "gmod" : c === "move" ? "move" : "";
  const badge = c === "add" ? `<span class="gb add">+ new</span>` : c === "del" ? `<span class="gb del">− deleted</span>` : c === "mod" ? `<span class="gb mod"><i>+1</i> <u>−1</u></span>` : c === "move" ? `<span class="tg">moved</span>` : "";
  const dl = lines.length ? `<div class="dl">${lines.map(([sg, t]) => `<div class="${sg === "+" ? "a" : "r"}">${sg === "+" ? "+" : "−"} ${esc(t)}</div>`).join("")}</div>` : `<small>${esc(c === "del" ? "still on main" : bx.tech || bx.kind)}</small>`;
  return `<div class="mbox ${cls}" style="left:${bx.x}px;top:${bx.y}px">${badge}<b>${esc(bx.name)}</b>${dl}</div>`;
}
function changeList(review) {
  const g = (t, items) => `<div class="grp">${t}</div>` + items.map(([m, name, what, who]) => `<div class="crow"><span class="mk ${m}">${{ add: "+", mod: "~", del: "−", move: "↦" }[m]}</span><span class="grow"><b style="font-weight:600">${name}</b> <span class="wh">${what}</span></span><span class="av" style="background:${who[1]}" title="${who[2]}">${who[0]}</span>${review ? `<span class="acts"><button class="y" title="Keep">✓</button><button class="n" title="Drop">✕</button></span>` : ""}</div>`).join("");
  return `<div class="clist">${g("Orders Service", [["add", "Idempotency Keys", "store, used by Order API", ["Z", "#4f8cff", "You"]], ["mod", "Order API", "tech, context, +1 reference", ["Z", "#4f8cff", "You"]], ["mod", "Payment Adapter", "async-stripe → 0.39", ["C", "#a78bfa", "Claude"]], ["move", "Pricing Engine", "moved down", ["S", "#34d399", "Sam"]]])}
    ${g("Landscape", [["del", "Mapbox", "and its line from API Gateway", ["S", "#34d399", "Sam"]]])}</div>`;
}
const STOPS = [["Mon", "main", before], ["Tue", "+ Idempotency Keys", middle], ["Today", "+4 more", after]];
function timeline(id, w = 700) {
  return `<div data-tl="${id}">${mini(before, after, "overlay", w)}<input type="range" min="0" max="2" step="1" value="2" style="margin-top:10px"/>
    <div class="ticks">${STOPS.map(([t, w], i) => `<span data-i="${i}" class="${i === 2 ? "on" : ""}">${t} · ${w}</span>`).join("")}</div></div>`;
}
function wireTimeline() {
  document.querySelectorAll("[data-tl]").forEach((el) => {
    const r = el.querySelector("input"), w = el.querySelector(".mini").offsetWidth || 700;
    r.oninput = () => { const i = +r.value; el.querySelector(".mini").outerHTML = mini(before, STOPS[i][2], i ? "overlay" : "plain", w); el.querySelectorAll(".ticks span").forEach((s) => s.classList.toggle("on", +s.dataset.i === i)); };
  });
}

function render() {
  reindex();
  if (!byId.has(S.here)) S.here = "orders";
  document.getElementById("panel").innerHTML = panel();
  canvas();
}
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-page],[data-tog],[data-row],[data-go],[data-view],[data-fork],[data-dialog],[data-close],[data-mm],#branchBtn,.crow .acts button");
  if (!t) { if (!e.target.closest("#branchPop")) closePop(); return; }
  if (t.dataset.page) { closeDialog(); document.querySelectorAll(".page").forEach((p) => p.classList.toggle("on", p.id === "page-" + t.dataset.page)); document.querySelectorAll(".proto [data-page]").forEach((b) => b.classList.toggle("on", b.dataset.page === t.dataset.page)); if (t.dataset.page === "diffs") gallery(); else render(); return; }
  if (t.id === "branchBtn") { const p = document.getElementById("branchPop"); if (p.classList.contains("on")) return closePop(); const r = t.getBoundingClientRect(); p.style.left = r.left + "px"; p.style.top = r.bottom + 6 + "px"; p.innerHTML = branchPop(); p.classList.add("on"); t.classList.add("open"); return; }
  if (t.matches(".crow .acts button")) { const row = t.closest(".crow"); const cls = t.classList.contains("y") ? "ok" : "no"; const was = row.classList.contains(cls); row.classList.remove("ok", "no"); if (!was) row.classList.add(cls); return; }
  if (t.dataset.tog) { e.stopPropagation(); S.open.has(t.dataset.tog) ? S.open.delete(t.dataset.tog) : S.open.add(t.dataset.tog); document.getElementById("panel").innerHTML = panel(); return; }
  if (t.dataset.row) {
    // A folder opens and expands on a click (a second click on the one you're in folds it); the arrow only folds.
    const n = byId.get(t.dataset.row);
    if (!kidsOf(n).length) go(parentOf.get(n.id), n.id);
    else if (S.here === n.id && S.open.has(n.id)) { S.open.delete(n.id); document.getElementById("panel").innerHTML = panel(); }
    else { S.open.add(n.id); go(n.id); }
    return;
  }
  if (t.dataset.view) { S.view = t.dataset.view; document.getElementById("panel").innerHTML = panel(); return; }
  if (t.dataset.fork) { S.fork = t.dataset.fork; closePop(); closeDialog(); render(); return; }
  if (t.dataset.dialog) { openDialog(t.dataset.dialog); return; }
  if (t.dataset.close !== undefined) { closeDialog(); return; }
  if (t.dataset.mm) { S.mm = t.dataset.mm; minimap(); pan(); return; }
  if (t.dataset.go) { const n = byId.get(t.dataset.go); if (n && n.id !== S.here) go(n.id); }
});
document.getElementById("scrim").addEventListener("click", (e) => { if (e.target.id === "scrim") closeDialog(); });
document.getElementById("gitState").addEventListener("change", (e) => { S.git = e.target.value; render(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") { closeDialog(); closePop(); } });
// Pan by dragging the canvas; click or drag in the map to move there.
(function () {
  const c = document.getElementById("canvas"); let drag = null;
  c.addEventListener("pointerdown", (e) => {
    const micro = e.target.closest("#micro");
    if (micro && e.target.closest(".tb.go")) return;
    if (micro) { const r = micro.querySelector(".thumb").getBoundingClientRect(); const to = (ev) => { S.pan.x = -(((ev.clientX - r.left) / TS) * F + ORG - S.cw / 2); S.pan.y = -(((ev.clientY - r.top) / TS) * F + ORG - S.ch / 2); pan(); }; to(e); drag = { micro: to }; c.setPointerCapture(e.pointerId); return; }
    if (e.target.closest(".box,.mm,.crumbs")) return;
    drag = { x: e.clientX - S.pan.x, y: e.clientY - S.pan.y }; c.classList.add("drag"); c.setPointerCapture(e.pointerId);
  });
  c.addEventListener("pointermove", (e) => { if (!drag) return; if (drag.micro) return drag.micro(e); S.pan.x = e.clientX - drag.x; S.pan.y = e.clientY - drag.y; pan(); });
  c.addEventListener("pointerup", () => { drag = null; c.classList.remove("drag"); });
  addEventListener("resize", pan);
})();
render();
</script>
</body>
</html>
