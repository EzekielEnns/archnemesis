<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>atlas · canvas v1 test</title>
<!--
  A test of the v1 direction (docs/v1.md), on one diagram, no side panel:
  - drop nodes by kind, sized by dragging (or click for the default size), toolbar per layer
  - a card beside each node, fields per kind, keyboard first (Tab, Enter, Esc)
  - tables: columns on the canvas, or folded (C)
  - code: folders and files linked by structure lines; groups box functions in
  - a note node: scratchpad, checklists, links to anything
  - arrows ask what they need, by what they join (a key's columns, a call's protocol,
    reads or writes, a topic's payload, what crosses a region)
  - cleanup: align, distribute, match size, tidy a selection
  Everything is kept in this browser (localStorage). "?" has the keys, reset and the model.
-->
<style>
:root {
  --bg: #111318; --panel: #1a1d24; --panel2: #15181e; --line: #2c313c; --line2: #23272f;
  --text: #d6dbe3; --muted: #8b93a3; --dim: #5d6472; --sel: #4f8cff; --violet: #b39ddb; --warn: #f29b9b;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.35 -apple-system, "Inter", "Segoe UI", sans-serif; overflow: hidden; }
button { font: inherit; color: inherit; }
#viewport { position: fixed; inset: 0; background-color: var(--bg); background-image: radial-gradient(#262a33 1px, transparent 1px); touch-action: none; }
#viewport.pan { cursor: grab; } #viewport.panning { cursor: grabbing; } #viewport.draw { cursor: crosshair; }
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
#edges { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: visible; z-index: 1; pointer-events: none; }
#edges path.hit { pointer-events: stroke; cursor: pointer; }
#nodes, #labels { position: absolute; left: 0; top: 0; }
#labels { z-index: 3; pointer-events: none; }
#overlay { position: absolute; left: 0; top: 0; z-index: 6; }

/* nodes */
.node { position: absolute; border-radius: 10px; user-select: none; }
.node.frame { z-index: 0; border: 1.5px dashed color-mix(in srgb, var(--c) 70%, transparent); background: color-mix(in srgb, var(--c) 4%, transparent); border-radius: 14px; }
.node.frame .flabel { position: absolute; left: 12px; top: 8px; display: flex; gap: 6px; align-items: center; color: var(--c); font-size: 13px; white-space: nowrap; }
.node.frame .flabel svg { width: 14px; height: 14px; }
.node.frame .flabel .short { font: 600 10px var(--mono); background: color-mix(in srgb, var(--c) 18%, transparent); border-radius: 4px; padding: 1px 5px; }
.node.k-group { border-style: solid; border-width: 1px; border-color: #343a46; background: rgba(255,255,255,0.015); }
.node.k-group .flabel { color: var(--muted); font-family: var(--mono); font-size: 12px; }
.node:not(.frame) { z-index: 2; }
.node.box { background: var(--panel); border: 1px solid var(--line); display: flex; gap: 10px; padding: 10px 12px; align-items: flex-start; overflow: hidden; }
.node.box .tile { flex: none; width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; background: color-mix(in srgb, var(--c) 16%, transparent); color: var(--c); }
.node.box .tile svg { width: 18px; height: 18px; }
.node .nm { font-size: 14px; color: #eef1f5; overflow-wrap: anywhere; }
.node .sub { font-size: 11.5px; color: var(--muted); margin-top: 2px; overflow-wrap: anywhere; }
.node .desc { font-size: 11.5px; color: var(--dim); margin-top: 4px; overflow: hidden; }
.node .ph { color: var(--dim); font-style: italic; }
.node.k-topic { border-radius: 30px; }
.node.k-actor { border-radius: 30px; }
/* code: folders and files have no box, just a mark and a name */
.node.slim { display: flex; align-items: center; gap: 8px; padding: 4px 8px; color: var(--c); border: 1px solid transparent; }
.node.slim svg { width: 16px; height: 16px; flex: none; }
.node.slim .path { font: 12.5px var(--mono); color: #e3c3a4; overflow-wrap: anywhere; }
.node.slim .nm { font: 13px var(--mono); color: #f0d2b4; }
.node.slim .sub { font: 11px var(--mono); }
.node.slim:hover { border-color: var(--line); background: var(--panel2); }
.node.fn { background: var(--panel2); border: 1px solid var(--line); border-left: 3px solid var(--c); padding: 7px 10px; overflow: hidden; border-radius: 7px; }
.node.fn .sig { font: 12.5px var(--mono); color: #bfe9e9; overflow-wrap: anywhere; }
.node.fn .body { margin-top: 6px; font: 11px/1.45 var(--mono); color: var(--muted); white-space: pre-wrap; }
/* tables */
.node.table { background: var(--panel); border: 1px solid var(--line); overflow: hidden; }
.node.table .th { display: flex; gap: 10px; align-items: center; padding: 10px 12px; }
.node.table .th .tile { flex: none; width: 30px; height: 30px; border-radius: 7px; display: grid; place-items: center; background: color-mix(in srgb, var(--c) 16%, transparent); color: var(--c); }
.node.table .th .tile svg { width: 16px; height: 16px; }
.node.table .th .nm { font: 600 13.5px var(--mono); }
.node.table .keys { padding: 0 12px 10px; display: flex; flex-wrap: wrap; gap: 4px; }
.node.table .rows { border-top: 1px solid var(--line2); }
.node.table .row { height: 26px; display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; align-items: center; padding: 0 10px 0 8px; font: 12px var(--mono); border-bottom: 1px solid var(--line2); }
.node.table .row:last-child { border-bottom: none; }
.node.table .row .cn { color: #e6e9ee; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.node.table .row .ct { color: var(--dim); font-size: 11px; padding-left: 8px; }
.node.table .fold { position: absolute; right: 8px; top: 10px; background: none; border: 1px solid var(--line); border-radius: 6px; color: var(--muted); font-size: 10.5px; padding: 1px 6px; cursor: pointer; }
.chip { font: 600 9px var(--mono); padding: 0 4px; border-radius: 4px; line-height: 15px; display: inline-block; }
.chip.pk { color: #f2c46d; background: #3a2f17; } .chip.fk { color: #8fb8ff; background: #1c2a44; } .chip.uq { color: #aab2c0; background: #262b34; } .chip.pii { color: #f29b9b; background: #3a1c1c; }
.node.table .keys .chip { font-weight: 500; font-size: 10px; padding: 0 5px; }
/* notes */
.node.note { background: #2a2717; border: 1px solid #4a4425; color: #eadfae; padding: 10px 12px; font-size: 12.5px; white-space: pre-wrap; overflow: hidden; border-radius: 6px; box-shadow: 0 6px 18px rgba(0,0,0,0.25); }
.node.note .done { color: #8f8763; text-decoration: line-through; }
/* state */
.node.sel { outline: 2px solid var(--sel); outline-offset: 2px; }
.node.frame.sel { outline-offset: 0; }
.node.dim { opacity: 0.22; }
.node.hot { outline: 2px dashed var(--sel); outline-offset: 3px; }
.handle { position: absolute; width: 9px; height: 9px; background: #fff; border: 1.5px solid var(--sel); border-radius: 2px; z-index: 5; }
.port { position: absolute; width: 12px; height: 12px; border-radius: 50%; background: var(--sel); border: 2px solid var(--bg); z-index: 5; cursor: crosshair; }
.port:hover { transform: scale(1.3); }
#ghost { position: absolute; border: 1.5px dashed var(--sel); border-radius: 10px; background: rgba(79,140,255,0.06); display: none; z-index: 4; }
#marquee { position: fixed; border: 1px solid var(--sel); background: rgba(79,140,255,0.08); display: none; z-index: 20; pointer-events: none; }

/* edge labels */
.elabel { position: absolute; transform: translate(-50%, -50%); background: var(--bg); border-radius: 5px; padding: 1px 6px; font: 11px var(--mono); color: var(--muted); white-space: nowrap; display: flex; gap: 5px; align-items: center; }
.elabel .rg { color: #c9b8f0; background: #2a2340; border-radius: 4px; padding: 0 5px; font-weight: 600; font-size: 9.5px; }
.elabel .warn { color: var(--warn); background: #3a1c1c; border-radius: 4px; padding: 0 5px; font-weight: 600; font-size: 9.5px; }
.elabel.sel { color: #fff; outline: 1px solid var(--sel); }

/* chrome */
.island { position: fixed; z-index: 30; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.35); display: flex; align-items: center; gap: 2px; padding: 4px; }
.ib { position: relative; background: none; border: none; border-radius: 8px; width: 34px; height: 34px; display: grid; place-items: center; cursor: pointer; color: var(--muted); }
.ib:hover { background: #242833; color: var(--text); }
.ib.on { background: #23304d; color: #cfe0ff; }
.ib svg { width: 17px; height: 17px; }
.ib .k { position: absolute; right: 3px; bottom: 1px; font-size: 9px; color: var(--dim); }
.sep { width: 1px; height: 22px; background: var(--line); margin: 0 4px; }
.tl { left: 12px; top: 12px; padding: 4px 10px 4px 4px; gap: 6px; }
.tl .crumb { color: var(--muted); } .tl .crumb b { color: var(--text); font-weight: 500; }
.tc { left: 50%; top: 12px; transform: translateX(-50%); }
.layers { display: flex; background: var(--panel2); border-radius: 8px; padding: 2px; margin-right: 4px; }
.layers button { background: none; border: none; border-radius: 6px; padding: 5px 9px; color: var(--muted); cursor: pointer; font-size: 12px; }
.layers button.on { background: #2a2f3a; color: var(--text); }
.tr { right: 12px; top: 12px; gap: 6px; padding: 4px 6px; }
.av { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 600; color: #111; }
.av.idle { opacity: 0.35; }
.av.bot { background: #3b3352; color: #c9b8f0; }
.bl { left: 12px; bottom: 12px; padding: 2px; }
.bl .ib { width: 28px; height: 28px; } .bl .ib svg { width: 15px; height: 15px; }
.zoom { font-size: 12px; color: var(--muted); width: 44px; text-align: center; }
.hint { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); color: var(--dim); font-size: 12px; z-index: 30; pointer-events: none; }

/* the card beside a node or arrow */
#card { position: fixed; z-index: 40; width: 292px; background: var(--panel); border: 1px solid #353b48; border-radius: 12px; box-shadow: 0 14px 40px rgba(0,0,0,0.5); padding: 10px; display: none; }
#card.show { display: block; }
#card .hd { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; color: var(--muted); font-size: 11.5px; }
#card .hd svg { width: 14px; height: 14px; }
#card .hd .kd { color: var(--c); display: flex; gap: 5px; align-items: center; }
#card .hd .sp { flex: 1; }
#card .hd button { background: none; border: none; color: var(--dim); cursor: pointer; padding: 2px 4px; border-radius: 5px; font-size: 11px; }
#card .hd button:hover { color: var(--text); background: #242833; }
#card label { display: block; font-size: 10.5px; color: var(--dim); text-transform: uppercase; letter-spacing: .04em; margin: 8px 0 3px; }
#card label:first-of-type { margin-top: 0; }
#card input, #card textarea, #card select { width: 100%; background: var(--panel2); border: 1px solid var(--line); border-radius: 7px; color: var(--text); padding: 6px 8px; font: 13px inherit; outline: none; }
#card input:focus, #card textarea:focus, #card select:focus { border-color: #4f6fae; }
#card input.big { font-size: 15px; }
#card .mono, #card textarea { font-family: var(--mono); font-size: 12px; }
#card textarea { resize: vertical; min-height: 64px; line-height: 1.45; }
#card .two { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
#card .seg { display: flex; gap: 4px; }
#card .seg button { flex: 1; background: var(--panel2); border: 1px solid var(--line); border-radius: 7px; padding: 5px 4px; font-size: 11.5px; color: var(--muted); cursor: pointer; }
#card .seg button.on { border-color: #4f6fae; color: #cfe0ff; background: #1f2a40; }
#card .ft { margin-top: 10px; display: flex; justify-content: space-between; color: var(--dim); font-size: 10.5px; }
#card .more { margin-top: 8px; }
#card .more summary { cursor: pointer; color: var(--muted); font-size: 11.5px; }
#card .help { color: var(--dim); font-size: 11px; margin-top: 3px; }
#card .warnline { color: var(--warn); font-size: 11.5px; margin-top: 6px; }

/* selection bar */
#selbar { display: none; padding: 3px; }
#selbar.show { display: flex; }
#selbar button { background: none; border: none; color: var(--muted); padding: 4px 7px; border-radius: 6px; cursor: pointer; font-size: 12px; }
#selbar button:hover { background: #242833; color: var(--text); }

/* modal */
#modal { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,0.5); display: none; place-items: center; }
#modal.show { display: grid; }
#modal .box { width: min(760px, 92vw); max-height: 84vh; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; }
#modal h3 { margin: 0 0 10px; font-size: 15px; }
#modal pre { font: 12px/1.5 var(--mono); color: #c9d1dd; background: var(--panel2); border-radius: 8px; padding: 12px; white-space: pre-wrap; }
#modal table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
#modal td { padding: 4px 8px; border-bottom: 1px solid var(--line2); vertical-align: top; }
#modal td:first-child { font-family: var(--mono); color: #cfe0ff; white-space: nowrap; }
#modal .acts { display: flex; gap: 8px; margin-top: 12px; }
#modal .acts button { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
#toast { position: fixed; left: 50%; bottom: 46px; transform: translateX(-50%); background: #262b36; border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; z-index: 70; display: none; font-size: 12.5px; }
</style>
</head>
<body>
<div id="viewport"><div id="world"><svg id="edges"></svg><div id="nodes"></div><div id="labels"></div><div id="overlay"></div><div id="ghost"></div></div></div>
<div id="marquee"></div>

<div class="island tl">
  <button class="ib" title="Back (up one level). One diagram in this test." id="back"></button>
  <span class="crumb">acme › <b>Faces bridge</b></span>
</div>
<div class="island tc" id="toolbar"></div>
<div class="island tr">
  <span class="av" style="background:#f9a8d4" title="Zeek · here">Z</span>
  <span class="av" style="background:#93c5fd" title="Jack · here">J</span>
  <span class="av idle" style="background:#86efac" title="Ryan · idle 2h">R</span>
  <span class="av bot" title="trailoftears (agent)" id="botav"></span>
  <span class="sep"></span>
  <button class="ib" title="Notes" id="notesbtn"></button>
</div>
<div class="island bl">
  <button class="ib" id="zout" title="Zoom out (−)"></button>
  <span class="zoom" id="zlabel">100%</span>
  <button class="ib" id="zin" title="Zoom in (+)"></button>
  <button class="ib" id="zfit" title="Fit (⇧1)"></button>
  <span class="sep"></span>
  <button class="ib" id="helpbtn" title="Keys, the model, reset (?)"></button>
</div>
<div class="island" id="selbar"></div>
<div id="card"></div>
<div id="modal"><div class="box" id="modalbox"></div></div>
<div id="toast"></div>
<div class="hint" id="hint"></div>

<script>
// ---------- icons (lucide, ISC) ----------
const P = {
  select: '<path d="M4.037 4.688a.495.495 0 0 1 .651-.651l16 6.5a.5.5 0 0 1-.063.947l-6.124 1.58a2 2 0 0 0-1.438 1.435l-1.579 6.126a.5.5 0 0 1-.947.063z"/>',
  arrow: '<path d="M7 17 17 7"/><path d="M7 7h10v10"/>',
  actor: '<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
  app: '<rect x="2" y="4" width="20" height="16" rx="2"/><path d="M10 4v4"/><path d="M2 8h20"/><path d="M6 4v4"/>',
  store: '<ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5"/><path d="M3 12A9 3 0 0 0 21 12"/>',
  topic: '<path d="M4.9 19.1C1 15.2 1 8.8 4.9 4.9"/><path d="M7.8 16.2c-2.3-2.3-2.3-6.1 0-8.5"/><circle cx="12" cy="12" r="2"/><path d="M16.2 7.8c2.3 2.3 2.3 6.1 0 8.5"/><path d="M19.1 4.9C23 8.8 23 15.1 19.1 19"/>',
  component: '<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/>',
  region: '<circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/>',
  group: '<path d="M5 3a2 2 0 0 0-2 2"/><path d="M19 3a2 2 0 0 1 2 2"/><path d="M21 19a2 2 0 0 1-2 2"/><path d="M5 21a2 2 0 0 1-2-2"/><path d="M9 3h1"/><path d="M9 21h1"/><path d="M14 3h1"/><path d="M14 21h1"/><path d="M3 9v1"/><path d="M21 9v1"/><path d="M3 14v1"/><path d="M21 14v1"/>',
  dir: '<path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>',
  file: '<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="m10 13-2 2 2 2"/><path d="m14 17 2-2-2-2"/>',
  fn: '<rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 17c2 0 2.8-1 2.8-2.8V10c0-2 1-3.3 3.2-3"/><path d="M9 11.2h5.7"/>',
  table: '<path d="M9 3H5a2 2 0 0 0-2 2v4m6-6h10a2 2 0 0 1 2 2v4M9 3v18m0 0h10a2 2 0 0 0 2-2V9M9 21H5a2 2 0 0 1-2-2V9m0 0h18"/>',
  note: '<path d="M16 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8Z"/><path d="M15 3v4a2 2 0 0 0 2 2h4"/>',
  back: '<path d="m15 18-6-6 6-6"/>',
  msg: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
  help: '<circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/>',
  minus: '<path d="M5 12h14"/>', plus: '<path d="M5 12h14"/><path d="M12 5v14"/>',
  fit: '<path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/>',
  bot: '<path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/>',
};
const icon = (k) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${P[k] || ""}</svg>`;

// ---------- kinds ----------
// layers: which toolbar shows it. frame: drawn behind, holds what's inside it.
const K = {
  region:    { label: "Region",    layers: ["infra"],                    c: "#b39ddb", frame: true, w: 420, h: 280 },
  app:       { label: "App",       layers: ["infra", "services"],        c: "#34d399", w: 200, h: 70 },
  store:     { label: "Store",     layers: ["infra", "services", "data"], c: "#fbbf24", w: 200, h: 70 },
  topic:     { label: "Topic",     layers: ["infra", "services"],        c: "#fb923c", w: 200, h: 60 },
  actor:     { label: "Actor",     layers: ["services"],                 c: "#a78bfa", w: 170, h: 60 },
  component: { label: "Component", layers: ["services"],                 c: "#f472b6", w: 200, h: 70 },
  group:     { label: "Group",     layers: ["code"],                     c: "#8b93a3", frame: true, w: 340, h: 220 },
  dir:       { label: "Folder",    layers: ["code"],                     c: "#f0a060", w: 200, h: 34 },
  file:      { label: "File",      layers: ["code"],                     c: "#f0a060", w: 200, h: 46 },
  fn:        { label: "Function",  layers: ["code"],                     c: "#7dcfcf", w: 240, h: 38 },
  table:     { label: "Table",     layers: ["data"],                     c: "#f2c46d", w: 240, h: 64 },
  note:      { label: "Note",      layers: ["*"],                        c: "#e9d68a", w: 220, h: 120 },
};
const LAYERS = { all: "All", infra: "Infra", services: "Services", code: "Code", data: "Data" };
const TOOLS = {
  all: ["actor", "app", "component", "store", "topic", "region", "group", "dir", "file", "fn", "table"],
  infra: ["region", "app", "store", "topic"],
  services: ["actor", "app", "component", "store", "topic"],
  code: ["group", "dir", "file", "fn"],
  data: ["store", "table"],
};
const TECH = ["Cloud Run", "GKE", "Postgres", "Cloud SQL", "Spanner", "Pub/Sub", "GCS", "Redis", "BigQuery", "Rekognition", "Node", "Rust", "Go", "Python", "React", "Stripe"];
const G = 10, snap = (v) => Math.round(v / G) * G;
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const uid = (p) => p + Math.random().toString(36).slice(2, 7);

// ---------- columns: "name type [pk] [fk] [uq] [pii]", type? when nullable ----------
function parseCols(text) {
  return text.split("\n").map((l) => l.trim()).filter(Boolean).map((l) => {
    const [name, type = "", ...flags] = l.split(/\s+/);
    const f = flags.map((x) => x.toLowerCase());

function zoomBy(f) { const c = toWorld(innerWidth / 2, innerHeight / 2); view.z = Math.min(2.5, Math.max(0.25, view.z * f)); view.x = innerWidth / 2 - c.x * view.z; view.y = innerHeight / 2 - c.y * view.z; render(); }
function fit() {
  const L = Math.min(...S.nodes.map((n) => n.x)), T = Math.min(...S.nodes.map((n) => n.y)), R = Math.max(...S.nodes.map((n) => n.x + n.w)), B = Math.max(...S.nodes.map((n) => n.y + nodeH(n)));
  view.z = Math.min(1.4, (innerWidth - 120) / (R - L), (innerHeight - 160) / (B - T));
  view.x = (innerWidth - (R - L) * view.z) / 2 - L * view.z; view.y = 70 + (innerHeight - 110 - (B - T) * view.z) / 2 - T * view.z;
  render();
}

// ---------- help and the model behind the drawing ----------
function modelYaml() {
  const out = ["objects:"], kindOf = { region: null, group: "module", dir: "module", file: "module", fn: "function", topic: "store", note: null };
  for (const n of S.nodes) {
    const kind = n.kind in kindOf ? kindOf[n.kind] : n.kind;
    if (!kind) continue;
    const name = n.name || n.path || n.sig || n.id;
    out.push(`  - id: ${n.id}`, `    kind: ${kind}`, `    name: ${JSON.stringify(name)}`);
    const f = frameOf(n); if (f && f.kind !== "region") out.push(`    in: ${f.id}`);
    if (n.tech) out.push(`    tech: ${n.tech}`);
    if (n.path) out.push(`    path: app:${n.path}`);
    if (n.cols?.length) { out.push("    columns:"); for (const c of n.cols) out.push(`      - { name: ${c.name}, type: ${JSON.stringify(c.type)}${c.pk ? ", pk: true" : ""}${c.nul ? ", nullable: true" : ""}${c.uq ? ", unique: true" : ""}${c.pii ? ", personal: true" : ""} }`); }
    if (n.body) out.push(`    context: |`, ...n.body.split("\n").map((l) => "      " + l));
  }
  out.push("connections:");
  for (const e of S.edges) {
    const t = edgeType(e);
    if (t === "note" || t === "struct") continue;
    out.push(`  - from: ${e.from}`, `    to: ${e.to}`);
    const label = t === "fk" ? null : t === "rw" ? e.mode || "reads & writes" : t === "pub" ? e.payload || "publishes" : e.label;
    if (label) out.push(`    label: ${JSON.stringify(label)}`);
    if (t === "fk" && e.fromCol) out.push(`    column: ${e.fromCol}`, `    to_column: ${targetCol(node(e.to), e)}`);
    if (e.how) out.push(`    tech: ${e.how}`);
    if (e.carries && crossing(e)) out.push(`    carries: ${e.carries}`);
  }
  out.push("", "# boundaries.yaml", "boundaries:");
  for (const r of S.nodes.filter((n) => n.kind === "region")) out.push(`  - id: ${(r.short || r.id).toLowerCase()}`, `    kind: region`, `    name: ${r.name}`, `    include: [{ ids: [${S.nodes.filter((n) => regionOf(n) === r && !K[n.kind].frame).map((n) => n.id).join(", ")}] }]`);
  out.push("", "# notes and structure lines stay on the diagram (layout), not in the model");
  return out.join("\n");
}

}
