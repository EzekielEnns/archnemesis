<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>atlas · left panel prototype</title>
<style>
  :root {
    --bg: #0f1115; --side: #12151b; --panel: rgba(22, 25, 32, 0.96); --field: #1b1f27;
    --line: #262c36; --line-strong: #353d4a; --text: #e6e9ef; --muted: #8b93a3; --accent: #4f8cff;
    --add: #34d399; --mod: #fbbf24; --del: #f87171;
    --actor: #a78bfa; --system: #60a5fa; --app: #34d399; --store: #fbbf24; --component: #f472b6;
    --module: #fb923c; --function: #5eead4; --library: #c084fc; --table: #facc15; --group: #94a3b8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 Inter, ui-sans-serif, system-ui, -apple-system, sans-serif; }
  button { font: inherit; color: inherit; }
  .app { display: grid; grid-template-rows: 48px 1fr; height: 100vh; }

  /* Variant switcher (prototype only) */
  .proto { display: flex; align-items: center; gap: 8px; padding: 0 14px; border-bottom: 1px solid var(--line); background: #0c0e12; }
  .proto b { font-weight: 600; margin-right: 8px; color: var(--muted); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
  .proto button { border: 1px solid var(--line); background: var(--field); border-radius: 8px; padding: 6px 10px; cursor: pointer; color: var(--muted); }
  .proto button.on { color: var(--text); border-color: var(--accent); background: rgba(79,140,255,.12); }
  .proto .hint { margin-left: auto; color: var(--muted); font-size: 12px; }

  .stage { position: relative; display: flex; min-height: 0; }

  /* --- The panel ------------------------------------------------------------------ */
  .panel { width: 292px; flex: none; display: flex; flex-direction: column; background: var(--side); border-right: 1px solid var(--line); min-height: 0; transition: width .18s; }
  .panel.rail { width: 60px; }
  .p-head { padding: 12px 12px 8px; display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid var(--line); }
  .design { display: flex; align-items: center; gap: 8px; }
  .logo { width: 26px; height: 26px; border-radius: 7px; background: linear-gradient(135deg, #4f8cff, #a78bfa); display: grid; place-items: center; font-weight: 800; font-size: 12px; }
  .design b { font-size: 14px; flex: 1; }
  .icon { width: 28px; height: 28px; display: grid; place-items: center; border: 0; background: none; border-radius: 7px; cursor: pointer; color: var(--muted); }
  .icon:hover { background: var(--field); color: var(--text); }

  .fork-pill { display: flex; align-items: center; gap: 8px; width: 100%; padding: 7px 10px; border: 1px solid var(--line-strong); border-radius: 9px; background: var(--field); cursor: pointer; text-align: left; }
  .fork-pill:hover { border-color: var(--accent); }
  .fork-pill .name { flex: 1; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fork-pill .ahead { font-size: 11px; color: var(--muted); }
  .branch-ico { width: 18px; height: 18px; border-radius: 5px; display: grid; place-items: center; font-size: 11px; font-weight: 700; color: #0f1115; flex: none; }

  .seg { display: flex; padding: 3px; background: var(--field); border-radius: 9px; gap: 2px; }
  .seg button { flex: 1; border: 0; background: none; padding: 5px 6px; border-radius: 7px; cursor: pointer; color: var(--muted); font-size: 12px; }
  .seg button.on { background: #262c38; color: var(--text); }
  .search { display: flex; align-items: center; gap: 6px; padding: 6px 9px; border-radius: 8px; background: var(--field); color: var(--muted); font-size: 12px; }

  .p-body { flex: 1; overflow: auto; padding: 6px 6px 12px; min-height: 0; }
  .row { display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 6px; border-radius: 7px; cursor: pointer; white-space: nowrap; position: relative; }
  .row:hover { background: #191d25; }
  .row.here { background: rgba(79,140,255,.14); }
  .row.here::before { content: ""; position: absolute; left: -6px; top: 6px; bottom: 6px; width: 3px; border-radius: 2px; background: var(--accent); }
  .row.path .label { color: #cfd6e4; }
  .chev { width: 14px; color: var(--muted); font-size: 10px; text-align: center; flex: none; }
  .dot { width: 8px; height: 8px; border-radius: 3px; flex: none; }
  .label { flex: 1; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
  .row:hover .label, .row.here .label { color: var(--text); }
  .row .count { font-size: 10.5px; color: #5d6576; }
  .mark { font-size: 10px; font-weight: 700; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 5px; display: grid; place-items: center; }
  .mark.add { background: rgba(52,211,153,.16); color: var(--add); }
  .mark.mod { background: rgba(251,191,36,.16); color: var(--mod); }
  .mark.del { background: rgba(248,113,113,.16); color: var(--del); }
  .roll { display: flex; gap: 3px; }
  .roll span { font-size: 10px; font-weight: 600; }
  .del-row .label { text-decoration: line-through; }
  .sect { margin: 12px 6px 4px; font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: #5d6576; font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .sect .grow { flex: 1; height: 1px; background: var(--line); }

  /* Fork lanes (B) */
  .lanes-head { display: flex; gap: 0; align-items: flex-end; justify-content: flex-end; padding: 6px 10px 4px; border-bottom: 1px solid var(--line); }
  .lane-h { width: 22px; display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; }
  .lane-h .av { width: 18px; height: 18px; border-radius: 9px; display: grid; place-items: center; font-size: 9px; font-weight: 700; color: #0f1115; outline: 2px solid transparent; }
  .lane-h.on .av { outline-color: var(--text); }
  .lane-cells { display: flex; }
  .lane-cell { width: 22px; display: grid; place-items: center; }
  .lane-cell i { width: 7px; height: 7px; border-radius: 4px; display: block; }
  .lane-cell i.mod { background: var(--mod); } .lane-cell i.add { background: var(--add); } .lane-cell i.del { background: var(--del); }
  .lane-cell i.thread { width: 2px; height: 28px; border-radius: 0; opacity: .25; }

  /* Rail (C) */
  .rail-trail { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 0; flex: 1; }
  .lvl { position: relative; width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center; cursor: pointer; border: 1px solid transparent; background: var(--field); }
  .lvl.here { border-color: var(--accent); background: rgba(79,140,255,.14); }
  .lvl .k { width: 12px; height: 12px; border-radius: 4px; }
  .lvl .fbadge { position: absolute; right: -3px; top: -3px; min-width: 15px; height: 15px; padding: 0 3px; border-radius: 8px; font-size: 9px; font-weight: 700; display: grid; place-items: center; background: var(--mod); color: #0f1115; }
  .stem { width: 2px; height: 10px; background: var(--line-strong); border-radius: 1px; }
  .fly { position: absolute; left: 50px; top: 0; z-index: 30; min-width: 220px; padding: 6px; background: var(--panel); border: 1px solid var(--line-strong); border-radius: 11px; box-shadow: 0 14px 36px rgba(0,0,0,.55); display: none; }
  .lvl:hover .fly { display: block; }
  .fly .t { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; padding: 4px 6px; }
  .rail-foot { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 0; border-top: 1px solid var(--line); }

  /* --- The canvas mock --------------------------------------------------------------- */
  .canvas { position: relative; flex: 1; overflow: hidden; background-color: var(--bg); background-image: radial-gradient(#232833 1px, transparent 1px); background-size: 24px 24px; }
  .crumbs { position: absolute; left: 16px; top: 14px; display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 12px; z-index: 2; }
  .crumbs a { color: var(--muted); cursor: pointer; text-decoration: none; }
  .crumbs a:hover { color: var(--text); }
  .crumbs .cur { color: var(--text); font-weight: 600; }
  .fork-banner { position: absolute; left: 50%; transform: translateX(-50%); top: 12px; display: flex; gap: 10px; align-items: center; padding: 6px 8px 6px 12px; background: var(--panel); border: 1px solid var(--line-strong); border-radius: 10px; z-index: 3; font-size: 12px; }
  .fork-banner .btn { padding: 4px 9px; }
  .frame { position: absolute; border: 1px solid #2b3240; border-radius: 14px; background: rgba(22,25,32,.35); }
  .frame .ft { position: absolute; left: 14px; top: 10px; color: #aeb6c6; font-size: 13px; }
  .box { position: absolute; width: 184px; height: 72px; border-radius: 10px; border: 1px solid #2a303c; background: #181c24; padding: 10px 12px; cursor: pointer; transition: transform .12s, border-color .12s; }
  .box:hover { border-color: #3d4656; transform: translateY(-1px); }
  .box .n { font-weight: 600; display: flex; align-items: center; gap: 7px; }
  .box .s { color: var(--muted); font-size: 11.5px; margin-top: 3px; }
  .box .inside { position: absolute; left: 12px; bottom: 7px; font-size: 10.5px; color: #6b7486; }
  .box.add { border-color: var(--add); box-shadow: 0 0 0 3px rgba(52,211,153,.15); }
  .box.mod { border-color: var(--mod); box-shadow: 0 0 0 3px rgba(251,191,36,.15); }
  .box.del { border-color: var(--del); border-style: dashed; opacity: .6; }
  .box .tag { position: absolute; right: 8px; top: -9px; font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 6px; }
  .box.add .tag { background: var(--add); color: #0f1115; } .box.mod .tag { background: var(--mod); color: #0f1115; } .box.del .tag { background: var(--del); color: #0f1115; }

  /* Tree minimap (C, and a corner option for A and B) */
  .treemap { position: absolute; right: 16px; bottom: 16px; width: 260px; background: var(--panel); border: 1px solid var(--line-strong); border-radius: 12px; padding: 10px; z-index: 4; box-shadow: 0 10px 30px rgba(0,0,0,.45); }
  .treemap .tt { display: flex; align-items: center; justify-content: space-between; font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; }
  .icicle { display: flex; flex-direction: column; gap: 2px; }
  .ic-row { display: flex; gap: 2px; height: 16px; }
  .ic { height: 100%; border-radius: 3px; background: #232a36; cursor: pointer; position: relative; min-width: 3px; }
  .ic:hover { filter: brightness(1.35); }
  .ic.path { background: #2e4470; }
  .ic.here { background: var(--accent); }
  .ic.ch::after { content: ""; position: absolute; right: 2px; top: 2px; width: 5px; height: 5px; border-radius: 3px; background: var(--mod); }
  .ic.ch.add::after { background: var(--add); }
  .treemap .legend { display: flex; gap: 10px; margin-top: 8px; font-size: 10.5px; color: var(--muted); }
  .treemap .legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }

  /* --- Dialogs --------------------------------------------------------------------- */
  .scrim { position: fixed; inset: 0; background: rgba(5,7,10,.6); backdrop-filter: blur(3px); display: none; place-items: center; z-index: 50; }
  .scrim.on { display: grid; }
  .dialog { width: 480px; max-width: calc(100vw - 32px); background: #161a21; border: 1px solid var(--line-strong); border-radius: 14px; box-shadow: 0 30px 80px rgba(0,0,0,.6); overflow: hidden; }
  .d-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .d-head b { font-size: 15px; flex: 1; }
  .d-body { padding: 14px 16px; display: flex; flex-direction: column; gap: 14px; max-height: 70vh; overflow: auto; }
  .d-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }
  .btn { border: 1px solid var(--line-strong); background: var(--field); border-radius: 8px; padding: 7px 12px; cursor: pointer; }
  .btn:hover { border-color: #4a5466; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field > span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
  .opts { display: flex; flex-wrap: wrap; gap: 6px; }
  .opt { border: 1px solid var(--line-strong); background: var(--field); border-radius: 8px; padding: 6px 10px; cursor: pointer; color: var(--muted); }
  .opt.on { border-color: var(--accent); color: var(--text); background: rgba(79,140,255,.12); }
  .switch { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 0; }
  .switch small { display: block; color: var(--muted); font-size: 11.5px; }
  .tog { width: 34px; height: 20px; border-radius: 10px; background: #2a303c; position: relative; cursor: pointer; flex: none; border: 0; }
  .tog::after { content: ""; position: absolute; left: 3px; top: 3px; width: 14px; height: 14px; border-radius: 7px; background: #9aa3b4; transition: left .15s; }
  .tog.on { background: var(--accent); } .tog.on::after { left: 17px; background: #fff; }
  input.text { width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--field); color: var(--text); font: inherit; }
  .fork-list { display: flex; flex-direction: column; gap: 2px; }
  .fork-item { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 9px; cursor: pointer; }
  .fork-item:hover { background: var(--field); }
  .fork-item.on { background: rgba(79,140,255,.12); }
  .fork-item .meta { flex: 1; min-width: 0; }
  .fork-item .meta b { display: block; font-weight: 600; }
  .fork-item .meta small { color: var(--muted); }
  .diffsum { display: flex; gap: 6px; }
  .changes { display: flex; flex-direction: column; gap: 2px; }
  .change { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 8px; background: #191d25; }
  .change .where { margin-left: auto; color: var(--muted); font-size: 11.5px; }
  .popover { position: absolute; z-index: 40; width: 300px; background: var(--panel); border: 1px solid var(--line-strong); border-radius: 12px; box-shadow: 0 16px 40px rgba(0,0,0,.55); padding: 6px; display: none; }
  .popover.on { display: block; }
  .pop-foot { display: flex; gap: 6px; padding: 6px; border-top: 1px solid var(--line); margin-top: 4px; }
  .note { position: absolute; left: 16px; bottom: 16px; max-width: 360px; padding: 10px 12px; font-size: 12px; color: var(--muted); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; z-index: 4; }
  .note b { color: var(--text); }
</style>
</head>
<body>
<div class="app">
  <div class="proto">
    <b>Left panel</b>
    <button data-v="A" class="on">A · Fork switcher</button>
    <button data-v="B">B · Fork lanes</button>
    <button data-v="C">C · Minimap rail</button>
    <span class="hint">Prototype on the Orbit Coffee design: click rows, forks, boxes, the gear and the avatar.</span>
  </div>
  <div class="stage">
    <aside class="panel" id="panel"></aside>
    <main class="canvas" id="canvas"></main>
    <div class="popover" id="forkPop"></div>
  </div>
</div>
<div class="scrim" id="scrim"><div class="dialog" id="dialog"></div></div>

<script>
// ---- Data: Orbit Coffee, as atlas holds it ------------------------------------------------
const T = (id, name, kind, kids = [], extra = {}) => ({ id, name, kind, kids, ...extra });
const tree = T("landscape", "Orbit Coffee", "landscape", [
  T("customer", "Customer", "actor"), T("barista", "Barista", "actor"), T("ops", "Ops team", "actor"),
  T("orbit", "Orbit Platform", "system", [
    T("clients", "Clients", "group", [T("mobile", "Mobile App", "app"), T("tablet", "Store Tablet", "app"), T("admin", "Web Admin", "app")]),
    T("gateway", "API Gateway", "app"),
    T("orders", "Orders Service", "app", [
      T("order-api", "Order API", "component", [T("http-rs", "http.rs", "module", [T("create", "create_order()", "function"), T("get", "get_order()", "function"), T("cancel", "cancel_order()", "function")])]),
      T("pricing", "Pricing Engine", "component", [T("pricing-rs", "pricing.rs", "module", [T("price", "price_cart()", "function"), T("promos", "apply_promos()", "function"), T("tax", "tax_for()", "function")])]),
      T("payment", "Payment Adapter", "component", [T("payments-rs", "payments.rs", "module", [T("charge", "charge()", "function"), T("refund", "refund()", "function"), T("webhook", "verify_webhook()", "function")])]),
      T("state", "Order State Machine", "component", [T("state-rs", "state.rs", "module", [T("advance", "advance()", "function"), T("publish", "publish_change()", "function")])]),
    ]),
    T("menu", "Menu Service", "app"), T("notify", "Notify Worker", "app"), T("loyalty", "Loyalty Service", "app", [], { future: true }),
    T("data", "Data", "group", [
      T("orders-db", "Orders DB", "store", [T("t-customers", "customers", "table"), T("t-orders", "orders", "table"), T("t-items", "order_items", "table"), T("t-payments", "payments", "table")]),
      T("menu-cache", "Menu Cache", "store"), T("events", "Order Events", "store"), T("receipts", "Receipts Bucket", "store"),
    ]),
  ]),
  T("stripe", "Stripe", "system", [], { external: true }), T("twilio", "Twilio", "system", [], { external: true }), T("mapbox", "Mapbox", "system", [], { external: true }),
]);
const libs = [["axum", "cargo", 5], ["sqlx", "cargo", 5], ["tokio", "cargo", 3], ["async-stripe", "cargo", 6], ["redis", "cargo", 2], ["serde", "cargo", 1], ["react-native", "npm", 1], ["next", "npm", 1], ["bullmq", "npm", 1]];

// Forks: what each changed (id → add | mod | del), plus things they add that main doesn't have.
const forks = [
  { id: "main", name: "main", who: "everyone", color: "#94a3b8", ahead: 0, changes: {} },
  { id: "zeek-idem", name: "zeek/idempotency", who: "Zeek · 2h ago", color: "#4f8cff", ahead: 4,
    changes: { create: "mod", payment: "mod", charge: "mod", "t-idem": "add" }, adds: { "orders-db": [T("t-idem", "idempotency_keys", "table")] } },
  { id: "agent-loyalty", name: "agent/loyalty-v1", who: "Claude · yesterday", color: "#a78bfa", ahead: 6,
    changes: { loyalty: "mod", "l-points": "add", "l-api": "add", gateway: "mod" }, adds: { loyalty: [T("l-api", "Loyalty API", "component"), T("l-points", "Points Ledger", "component")] } },
  { id: "sam-eu", name: "sam/eu-region", who: "Sam · 3d ago", color: "#34d399", ahead: 3,
    changes: { tax: "mod", "orders-db": "mod", mapbox: "del" } },
];

// ---- State -----------------------------------------------------------------------------
const S = { v: "A", here: "orbit", fork: "main", mode: "tree", open: new Set(["landscape", "orbit", "orders", "data", "clients"]), lane: null, treemap: true, settings: { theme: "dark", arrows: "curved", layers: true, showDiff: true, base: "main" } };
const byId = new Map();
const parentOf = new Map();
function index(node, parent) { byId.set(node.id, node); if (parent) parentOf.set(node.id, parent.id); (node.kids || []).forEach((k) => index(k, node)); }
const forkOf = () => forks.find((f) => f.id === S.fork);
function kidsOf(n) { const f = forkOf(); return [...(n.kids || []), ...((f.adds && f.adds[n.id]) || [])]; }
function rebuild() { byId.clear(); parentOf.clear(); const walk = (n, p) => { byId.set(n.id, n); if (p) parentOf.set(n.id, p.id); kidsOf(n).forEach((k) => walk(k, n)); }; walk(tree, null); }
const pathTo = (id) => { const out = []; let c = id; while (c) { out.unshift(c); c = parentOf.get(c); } return out; };
const changeOf = (id, f = forkOf()) => f.changes[id];
function rollup(n, f = forkOf()) { const r = { add: 0, mod: 0, del: 0 }; const walk = (x) => kidsOf(x).forEach((k) => { const c = f.changes[k.id]; if (c) r[c]++; walk(k); }); walk(n); return r; }
const kindColor = (k) => `var(--${k === "landscape" ? "system" : k})`;
const canOpen = (n) => kidsOf(n).length > 0;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

// ---- Panel -------------------------------------------------------------------------------
function forkPill() {
  const f = forkOf();
  return `<button class="fork-pill" id="forkBtn" title="Switch fork">
    <span class="branch-ico" style="background:${f.color}">⑂</span>
    <span class="name">${esc(f.name)}</span>
    ${f.ahead ? `<span class="ahead">${f.ahead} changes</span>` : `<span class="ahead">live</span>`}
    <span style="color:var(--muted)">▾</span></button>`;
}
function head(extra = "") {
  return `<div class="p-head">
    <div class="design"><span class="logo">O</span><b>Orbit Coffee</b>
      <button class="icon" data-dialog="settings" title="Settings">⚙</button>
      <button class="icon" data-dialog="signin" title="Account" style="border-radius:50%;background:#e9468e;color:#fff;width:24px;height:24px;font-size:11px;font-weight:700">Y</button></div>
    ${extra}</div>`;
}
function marks(n) {
  const c = changeOf(n.id);
  const self = c ? `<span class="mark ${c}">${c === "add" ? "+" : c === "mod" ? "~" : "−"}</span>` : "";
  if (S.open.has(n.id) || !canOpen(n)) return self;
  const r = rollup(n);
  const roll = r.add + r.mod + r.del ? `<span class="roll">${r.add ? `<span style="color:var(--add)">+${r.add}</span>` : ""}${r.mod ? `<span style="color:var(--mod)">~${r.mod}</span>` : ""}${r.del ? `<span style="color:var(--del)">−${r.del}</span>` : ""}</span>` : "";
  return self + roll;
}
function treeRows(n, depth, lanes) {
  const path = pathTo(S.here);
  let out = "";
  for (const k of kidsOf(n)) {
    if (S.mode === "modules" && !["system", "app", "component", "module", "function", "group"].includes(k.kind)) continue;
    const open = S.open.has(k.id);
    const c = changeOf(k.id);
    const cls = `row${S.here === k.id ? " here" : ""}${path.includes(k.id) ? " path" : ""}${c === "del" ? " del-row" : ""}`;
    const laneCells = lanes ? `<span class="lane-cells">${forks.slice(1).map((f) => { const ch = f.changes[k.id] || (rollupHas(k, f) ? "thread" : ""); return `<span class="lane-cell">${ch === "thread" ? `<i class="thread" style="background:${f.color}"></i>` : ch ? `<i class="${ch}" title="${esc(f.name)}: ${ch}"></i>` : ""}</span>`; }).join("")}</span>` : "";
    out += `<div class="${cls}" data-go="${k.id}" style="padding-left:${6 + depth * 14}px">
      <span class="chev" data-tog="${k.id}">${canOpen(k) ? (open ? "▾" : "▸") : ""}</span>
      <span class="dot" style="background:${kindColor(k.kind)};${k.external ? "opacity:.5" : ""}"></span>
      <span class="label">${esc(k.name)}${k.future ? ' <span style="color:var(--mod);font-size:10px">future</span>' : ""}</span>
      ${lanes ? "" : marks(k)}${!lanes && canOpen(k) && !open ? `<span class="count">${kidsOf(k).length}</span>` : ""}${laneCells}</div>`;
    if (open && canOpen(k)) out += treeRows(k, depth + 1, lanes);
  }
  return out;
}
function rollupHas(n, f) { const r = rollup(n, f); return r.add + r.mod + r.del > 0; }

function panelA() {
  return head(`${forkPill()}
    <div class="seg"><button data-mode="tree" class="${S.mode === "tree" ? "on" : ""}">Tree</button><button data-mode="modules" class="${S.mode === "modules" ? "on" : ""}">Modules</button></div>
    <div class="search">⌕ <span>Find a box, file or library</span></div>`) +
    `<div class="p-body">${S.mode === "tree" ? treeRows({ kids: [tree] }, 0, false) : modules()}</div>
    <div class="p-head" style="border-top:1px solid var(--line);border-bottom:0;flex-direction:row;gap:6px">
      <button class="btn" data-dialog="diff" style="flex:1">${S.fork === "main" ? "What's new" : "Compare with main"}</button>
      <button class="btn" data-dialog="newfork">New fork</button></div>`;
}
function modules() {
  return `<div class="sect">orbit repo<span class="grow"></span></div>` + treeRows({ kids: [byId.get("orders")] }, 0, false) +
    `<div class="sect">Libraries<span class="grow"></span></div>` +
    libs.map(([n, eco, uses]) => `<div class="row" title="Lights up everything that uses it"><span class="chev"></span><span class="dot" style="background:var(--library)"></span><span class="label">${n}</span><span class="count">${eco} · ${uses} use it</span></div>`).join("");
}
function panelB() {
  const lanesHead = `<div class="lanes-head"><span style="flex:1;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;align-self:center">Forks touching each part</span>${forks.slice(1).map((f) => `<span class="lane-h${S.fork === f.id ? " on" : ""}" data-fork="${f.id}" title="${esc(f.name)} · ${esc(f.who)}"><span class="av" style="background:${f.color}">${f.name[0].toUpperCase()}</span></span>`).join("")}</div>`;
  return head(`${forkPill()}<div class="search">⌕ <span>Find anything</span></div>`) + lanesHead +
    `<div class="p-body">${treeRows({ kids: [tree] }, 0, true)}</div>
    <div class="p-head" style="border-top:1px solid var(--line);border-bottom:0;font-size:12px;color:var(--muted)">
      Each column is a fork: a dot where it changed something, a thread down to it. Click a column to open that fork.</div>`;
}
function panelC() {
  const path = pathTo(S.here);
  const lv = path.map((id, i) => {
    const n = byId.get(id);
    const sibs = i === 0 ? [n] : kidsOf(byId.get(path[i - 1]));
    const r = rollup(n);
    const ch = r.add + r.mod + r.del;
    return `${i ? '<span class="stem"></span>' : ""}<div class="lvl${id === S.here ? " here" : ""}" data-go="${id}">
      <span class="k" style="background:${kindColor(n.kind)}"></span>${ch && S.fork !== "main" ? `<span class="fbadge">${ch}</span>` : ""}
      <div class="fly"><div class="t">${i === 0 ? "Design" : esc(byId.get(path[i - 1]).name)}</div>
      ${sibs.map((s) => `<div class="row${s.id === id ? " here" : ""}" data-go="${s.id}"><span class="dot" style="background:${kindColor(s.kind)}"></span><span class="label">${esc(s.name)}</span>${marks(s)}</div>`).join("")}</div></div>`;
  }).join("");
  const f = forkOf();
  return `<div class="rail-trail"><span class="logo" style="margin-bottom:8px">O</span>${lv}
    <span class="stem" style="opacity:.4"></span><div class="lvl" style="opacity:.5" title="Open a box to go deeper">＋</div></div>
    <div class="rail-foot">
      <button class="icon" id="forkBtn" title="Fork: ${esc(f.name)}" style="background:${f.color};color:#0f1115;font-weight:700">⑂</button>
      <button class="icon" data-dialog="diff" title="Changes">±</button>
      <button class="icon" data-dialog="settings" title="Settings">⚙</button>
      <button class="icon" data-dialog="signin" title="Account" style="border-radius:50%;background:#e9468e;color:#fff;width:26px;height:26px;font-size:11px;font-weight:700">Y</button></div>`;
}

// ---- Canvas mock -----------------------------------------------------------------------------
function canvas() {
  const n = byId.get(S.here);
  const kids = kidsOf(n);
  const f = forkOf();
  const path = pathTo(S.here);
  const crumbs = path.map((id, i) => i === path.length - 1 ? `<span class="cur">${esc(byId.get(id).name)}</span>` : `<a data-go="${id}">${esc(byId.get(id).name)}</a><span>›</span>`).join(" ");
  const groups = kids.filter((k) => k.kind === "group");
  const loose = kids.filter((k) => k.kind !== "group");
  let x = 60, y = 90, html = "";
  const box = (k, bx, by) => {
    const c = S.settings.showDiff ? changeOf(k.id) : null;
    const tag = c ? `<span class="tag">${c === "add" ? "new" : c === "mod" ? "changed" : "removed"}</span>` : "";
    const inside = kidsOf(k).length ? `<span class="inside">${kidsOf(k).length} inside →</span>` : "";
    return `<div class="box ${c || ""}" style="left:${bx}px;top:${by}px" data-go="${canOpen(k) ? k.id : ""}" title="${canOpen(k) ? "Open" : k.name}">${tag}
      <div class="n"><span class="dot" style="background:${kindColor(k.kind)}"></span>${esc(k.name)}</div><div class="s">${k.kind}${k.external ? " · external" : ""}${k.future ? " · future" : ""}</div>${inside}</div>`;
  };
  loose.forEach((k, i) => { html += box(k, x + (i % 3) * 210, y + Math.floor(i / 3) * 104); });
  const rows = Math.ceil(loose.length / 3);
  let gy = y + rows * 104 + 20;
  let gx = 60;
  groups.forEach((g) => {
    const gk = kidsOf(g);
    const w = Math.min(3, gk.length) * 210 + 30, h = Math.ceil(gk.length / 3) * 104 + 50;
    if (gx + w > 1100) { gx = 60; gy += h + 30; }
    html += `<div class="frame" style="left:${gx}px;top:${gy}px;width:${w}px;height:${h}px;border-style:dashed"><span class="ft">${esc(g.name)}</span></div>`;
    gk.forEach((k, i) => { html += box(k, gx + 15 + (i % 3) * 210, gy + 40 + Math.floor(i / 3) * 104); });
    gx += w + 30;
  });
  const banner = f.id !== "main" ? `<div class="fork-banner"><span class="branch-ico" style="background:${f.color}">⑂</span> On <b>${esc(f.name)}</b> · ${f.ahead} changes vs main
    <button class="btn" data-dialog="diff">Review</button><button class="btn" data-fork="main">Back to main</button></div>` : "";
  const tm = S.v === "C" || S.treemap ? treemap() : "";
  const note = S.v === "A" ? `<b>A.</b> The fork you're on is part of the view: a pill at the top, marks on the tree (+ new, ~ changed, − removed, rolled up on folded rows), and the canvas tints what changed.`
    : S.v === "B" ? `<b>B.</b> Every fork at once, as lanes beside the tree (like a git graph): see who is touching what before you open a fork.`
    : `<b>C.</b> The panel folds to a trail of levels; hover one for its siblings. The tree map (bottom right) shows the whole design and where you are.`;
  return `<div class="crumbs">${crumbs}</div>${banner}${html}${tm}<div class="note">${note}</div>`;
}
function treemap() {
  // An icicle: one row per depth; each box as wide as what's under it. Where you are is lit.
  const path = new Set(pathTo(S.here));
  const weight = (n) => Math.max(1, kidsOf(n).reduce((s, k) => s + weight(k), 0));
  const total = weight(tree);
  const f = forkOf();
  const cells = [];
  let depth = 0;
  const walk = (n, d, x0, x1) => {
    depth = Math.max(depth, d);
    cells.push({ n, d, x0, x1 });
    let x = x0;
    for (const k of kidsOf(n)) { const w = ((x1 - x0) * weight(k)) / weight(n); walk(k, d + 1, x, x + w); x += w; }
  };
  walk(tree, 0, 0, 100);
  const icicle = `<div style="position:relative;height:${(depth + 1) * 18}px">${cells.map(({ n, d, x0, x1 }) => { const c = f.changes[n.id] || (rollupHas(n, f) ? "mod" : ""); return `<div class="ic${path.has(n.id) ? " path" : ""}${n.id === S.here ? " here" : ""}${c && S.fork !== "main" ? " ch " + c : ""}" style="position:absolute;left:calc(${x0}% + 1px);width:calc(${x1 - x0}% - 2px);top:${d * 18}px;height:16px" data-go="${canOpen(n) ? n.id : parentOf.get(n.id)}" title="${esc(n.name)}"></div>`; }).join("")}</div>`;
  return `<div class="treemap"><div class="tt"><span>Where you are</span><button class="icon" id="tmClose" style="width:20px;height:20px">×</button></div>
    ${icicle}
    <div class="legend"><span><i style="background:var(--accent)"></i>here</span><span><i style="background:#2e4470"></i>path</span>${S.fork !== "main" ? `<span><i style="background:var(--mod)"></i>fork changed</span>` : ""}</div></div>`;
}

// ---- Fork popover and dialogs ----------------------------------------------------------------
function forkPop(anchor) {
  const pop = document.getElementById("forkPop");
  const r = anchor.getBoundingClientRect();
  pop.style.left = `${r.left + (S.v === "C" ? 44 : 0)}px`;
  pop.style.top = `${S.v === "C" ? r.top - 260 : r.bottom + 6}px`;
  pop.innerHTML = `<div class="fork-list">${forks.map((f) => `<div class="fork-item${S.fork === f.id ? " on" : ""}" data-fork="${f.id}">
    <span class="branch-ico" style="background:${f.color}">⑂</span><span class="meta"><b>${esc(f.name)}</b><small>${esc(f.who)}${f.ahead ? ` · ${f.ahead} changes` : " · what everyone sees"}</small></span>
    ${f.ahead ? `<span class="diffsum">${diffSum(f)}</span>` : ""}</div>`).join("")}</div>
    <div class="pop-foot"><button class="btn" data-dialog="newfork" style="flex:1">New fork</button><button class="btn" data-dialog="diff">Compare…</button></div>`;
  pop.classList.add("on");
}
function diffSum(f) { const c = Object.values(f.changes); const n = (k) => c.filter((x) => x === k).length; return `${n("add") ? `<span class="mark add">+${n("add")}</span>` : ""}${n("mod") ? `<span class="mark mod">~${n("mod")}</span>` : ""}${n("del") ? `<span class="mark del">−${n("del")}</span>` : ""}`; }

const opt = (group, val, label) => `<button class="opt${S.settings[group] === val ? " on" : ""}" data-set="${group}" data-val="${val}">${label}</button>`;
const tog = (key, label, sub) => `<div class="switch"><div>${label}<small>${sub}</small></div><button class="tog${S.settings[key] ? " on" : ""}" data-flip="${key}"></button></div>`;
const DIALOGS = {
  settings: () => `<div class="d-head"><b>Settings</b><button class="icon" data-close>×</button></div><div class="d-body">
    <div class="field"><span>Arrows</span><div class="opts">${opt("arrows", "curved", "Curved")}${opt("arrows", "elbow", "Elbow")}${opt("arrows", "straight", "Straight")}</div></div>
    <div class="field"><span>Theme</span><div class="opts">${opt("theme", "dark", "Dark")}${opt("theme", "light", "Light")}${opt("theme", "system", "System")}</div></div>
    ${tog("layers", "Remember layers per diagram", "Otherwise one set of layers for every diagram")}
    ${tog("showDiff", "Tint what a fork changed", "On the canvas, and marks in the tree")}
    <div class="field"><span>Design</span><div class="opts"><button class="opt">Tag groups…</button><button class="opt">Follow a git repo…</button><button class="opt">Export…</button></div></div>
    </div><div class="d-foot"><button class="btn primary" data-close>Done</button></div>`,
  diff: () => {
    const f = forkOf();
    const list = Object.entries(f.changes).map(([id, c]) => { const n = byId.get(id); if (!n) return ""; const parent = byId.get(parentOf.get(id)); return `<div class="change" data-go="${canOpen(n) ? id : parentOf.get(id)}" style="cursor:pointer"><span class="mark ${c}">${c === "add" ? "+" : c === "mod" ? "~" : "−"}</span><span class="dot" style="background:${kindColor(n.kind)}"></span>${esc(n.name)}<span class="where">in ${esc(parent ? parent.name : "")}</span></div>`; }).join("");
    return `<div class="d-head"><b>${f.id === "main" ? "What's new" : `Changes on ${esc(f.name)}`}</b><button class="icon" data-close>×</button></div><div class="d-body">
      <div class="field"><span>Compare with</span><div class="opts">${opt("base", "main", "main")}${opt("base", "visit", "My last visit")}${opt("base", "date", "A date…")}${opt("base", "fork", "Another fork…")}</div></div>
      ${tog("showDiff", "Show on the canvas", "Tint changed boxes; removed ones drawn dashed")}
      <div class="field"><span>${f.id === "main" ? "Since your last visit (2 days)" : `${f.ahead} changes`}</span><div class="changes">${list || `<div class="change">5 boxes changed by others: Orders Service, Menu Service…</div>`}</div></div>
      </div><div class="d-foot">${f.id !== "main" ? `<button class="btn">Discard fork</button><button class="btn primary">Propose to main</button>` : `<button class="btn primary" data-close>Done</button>`}</div>`;
  },
  signin: () => `<div class="d-head"><b>Account</b><button class="icon" data-close>×</button></div><div class="d-body">
    <div style="display:flex;gap:12px;align-items:center"><span style="width:40px;height:40px;border-radius:20px;background:#e9468e;display:grid;place-items:center;font-weight:700">Y</span><div><b>You</b><div style="color:var(--muted);font-size:12px">Signed in with GitHub</div></div></div>
    <div class="field"><span>Signed in on</span><div class="opts"><button class="opt on">GitHub</button><button class="opt">Google</button><button class="opt">Email link</button></div></div>
    <div class="field"><span>Agents</span><div class="change">Claude Code · connected over MCP<span class="where">2 sessions</span></div><button class="btn">Connect an agent…</button></div>
    </div><div class="d-foot"><button class="btn">Sign out</button><button class="btn primary" data-close>Done</button></div>`,
  newfork: () => `<div class="d-head"><b>New fork</b><button class="icon" data-close>×</button></div><div class="d-body">
    <div class="field"><span>Name</span><input class="text" value="zeek/" /></div>
    <div class="field"><span>Starts from</span><div class="opts"><button class="opt on">main</button><button class="opt">${esc(forkOf().name)}</button></div></div>
    <div style="color:var(--muted);font-size:12px">A fork is your own copy: edit freely, then propose it back to main. Others see it in the fork list.</div>
    </div><div class="d-foot"><button class="btn" data-close>Cancel</button><button class="btn primary" data-close>Create and switch</button></div>`,
};
function openDialog(k) { document.getElementById("dialog").innerHTML = DIALOGS[k](); document.getElementById("scrim").classList.add("on"); document.getElementById("dialog").dataset.k = k; closePop(); }
function closeDialog() { document.getElementById("scrim").classList.remove("on"); }
function closePop() { document.getElementById("forkPop").classList.remove("on"); }

// ---- Render + events ------------------------------------------------------------------------
function render() {
  rebuild();
  if (!byId.has(S.here)) S.here = "orbit";
  for (const id of pathTo(S.here)) S.open.add(id);
  const p = document.getElementById("panel");
  p.className = `panel${S.v === "C" ? " rail" : ""}`;
  p.innerHTML = S.v === "A" ? panelA() : S.v === "B" ? panelB() : panelC();
  document.getElementById("canvas").innerHTML = canvas();
  document.querySelectorAll(".proto button").forEach((b) => b.classList.toggle("on", b.dataset.v === S.v));
}
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-v],[data-tog],[data-go],[data-mode],[data-fork],[data-dialog],[data-close],[data-set],[data-flip],#forkBtn,#tmClose");
  if (!t) { if (!e.target.closest("#forkPop")) closePop(); return; }
  if (t.dataset.v) { S.v = t.dataset.v; render(); return; }
  if (t.id === "forkBtn") { const pop = document.getElementById("forkPop"); pop.classList.contains("on") ? closePop() : forkPop(t); return; }
  if (t.id === "tmClose") { S.treemap = false; render(); return; }
  if (t.dataset.tog !== undefined && t.dataset.tog) { e.stopPropagation(); S.open.has(t.dataset.tog) ? S.open.delete(t.dataset.tog) : S.open.add(t.dataset.tog); render(); return; }
  if (t.dataset.mode) { S.mode = t.dataset.mode; if (S.mode === "modules") { S.open.add("order-api"); S.open.add("http-rs"); } render(); return; }
  if (t.dataset.fork) { S.fork = t.dataset.fork; closePop(); closeDialog(); render(); return; }
  if (t.dataset.dialog) { openDialog(t.dataset.dialog); return; }
  if (t.dataset.close !== undefined) { closeDialog(); return; }
  if (t.dataset.set) { S.settings[t.dataset.set] = t.dataset.val; openDialog(document.getElementById("dialog").dataset.k); render(); return; }
  if (t.dataset.flip) { S.settings[t.dataset.flip] = !S.settings[t.dataset.flip]; openDialog(document.getElementById("dialog").dataset.k); render(); return; }
  if (t.dataset.go) { const n = byId.get(t.dataset.go); if (n && canOpen(n)) S.here = n.id; else if (n) S.here = parentOf.get(n.id) || S.here; closeDialog(); render(); }
});
document.getElementById("scrim").addEventListener("click", (e) => { if (e.target.id === "scrim") closeDialog(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") { closeDialog(); closePop(); } if ((e.metaKey || e.ctrlKey) && e.key === "ArrowUp") { const p = parentOf.get(S.here); if (p) { S.here = p; render(); } } });
render();
</script>
</body>
</html>
