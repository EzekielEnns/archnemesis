# Local git hooks (https://lefthook.dev). The same checks run on GitHub before a deploy (.github/workflows/check.yml); here they run
# before a push. `pnpm install` turns them on. `LEFTHOOK_EXCLUDE=slow git push` skips the
# slow jobs; `git push --no-verify` skips them all.
pre-push:
  # One after another: run side by side, the tests starve and time out.
  piped: true
  jobs:
    - name: format
      run: pnpm format:check
    - name: typecheck
      run: pnpm typecheck
    # New lint problems fail; the debt already recorded (eslint-suppressions.json) does not,
    # and shrinks as files are cleaned up (pnpm lint:bank).
    - name: lint
      run: pnpm lint
    - name: tests
      run: pnpm test:run
      tags: [slow]
    - name: dead-code
      run: pnpm knip
      tags: [slow]
