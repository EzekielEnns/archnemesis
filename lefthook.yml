# Local git hooks (https://lefthook.dev). There is no CI: what would run there runs here,
# before a push. `pnpm install` turns them on. `LEFTHOOK_EXCLUDE=slow git push` skips the
# slow jobs; `git push --no-verify` skips them all.
pre-push:
  parallel: true
  jobs:
    - name: format
      run: pnpm format:check
    - name: typecheck
      run: pnpm typecheck
    - name: lint
      run: pnpm lint
    # Files in this push must be clean outright: no leaning on recorded lint debt.
    - name: touched-files-clean
      glob: "{server,shared,src,cli}/**/*.{ts,tsx}"
      run: >-
        printf '{}' > "$(git rev-parse --git-path eslint-no-suppressions.json)" &&
        pnpm exec eslint --no-error-on-unmatched-pattern
        --suppressions-location "$(git rev-parse --git-path eslint-no-suppressions.json)"
        {push_files}
      fail_text: "Files you changed still carry recorded lint debt. Fix it, then pnpm lint:bank."
    - name: tests
      run: pnpm test:run
      tags: [slow]
    - name: dead-code
      run: pnpm knip
      tags: [slow]
